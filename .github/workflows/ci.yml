name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://terra:terra@localhost:5433/terra_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (PostGIS + pgvector, same image as dev)
        working-directory: .
        run: docker compose -f infra/dev/docker-compose.yml up -d --build --wait db
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Generated code is up to date
        run: |
          go tool oapi-codegen -config oapi-codegen.yaml ../../packages/contracts/openapi.yaml
          sqlc generate
          git diff --exit-code -- internal/api/gen internal/db
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Generated clients are up to date
        run: |
          npm run gen
          git diff --exit-code -- packages/contracts/ts packages/contracts/dart
      - run: npm run check -w @terra/contracts
      - run: npm run check -w web
      - run: npm run lint -w web
      - run: npm run test -w web
      - run: npm run check -w site
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start dependencies
        run: docker compose -f infra/dev/docker-compose.yml up -d --build --wait db centrifugo mailpit s3
      - name: Start api and worker
        run: |
          cd services/api
          go build -o bin/ ./cmd/...
          bin/migrate up
          bin/terractl seed-dev
          bin/terractl seed-search 500
          (bin/worker &) ; (bin/api &)
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 2; done
        env:
          DATABASE_URL: postgres://terra:terra@localhost:5433/terra?sslmode=disable
          CENTRIFUGO_API_URL: http://localhost:8000/api
          MIGRATE_ON_START: "true"
          SMTP_ADDR: localhost:1025
          S3_ENDPOINT: localhost:8333
          S3_ACCESS_KEY: terra
          S3_SECRET_KEY: terra-dev-secret
          WEB_BASE_URL: http://localhost:4173
          AUTH_RATE_BURST: "500"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          API_URL: http://localhost:8080
      - name: Static locality pages
        run: ./scripts/check-site.sh
        env:
          API_URL: http://localhost:8080

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  vision:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  images:
    runs-on: ubuntu-latest
    needs: [go, web, vision]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t terra/api services/api
      - run: docker build -f apps/web/Dockerfile -t terra/web .
      - run: docker build -t terra/vision services/vision
