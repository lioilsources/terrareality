name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN; jobs that need more ask for it (images: packages: write).
permissions:
  contents: read

env:
  TYPST_VERSION: "0.15.1"
  # sha256 of typst-x86_64-unknown-linux-musl.tar.xz from the GitHub release (same as services/api/Dockerfile).
  TYPST_SHA256: a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TEST_DATABASE_URL: postgres://terra:terra@localhost:5433/terra_test?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL (PostGIS + pgvector, same image as dev)
        working-directory: .
        run: docker compose -f infra/dev/docker-compose.yml up -d --build --wait db
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.31.1"
      - name: Generated code is up to date (server, sqlc, attribute catalog, lease templates)
        working-directory: .
        run: make gen-check-go
      - name: Install typst (lease documents)
        run: |
          curl -fsSL -o /tmp/typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/typst.tar.xz -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...
        env:
          SKIP_PERF: "1"
      - name: Search performance (M3 acceptance, 50k listings, runs alone)
        run: go test -count=1 -run TestSearchPerformance -v ./internal/integration/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Generated clients are up to date
        run: |
          npm run gen
          git diff --exit-code -- packages/contracts/ts packages/contracts/dart
      - run: npm run check -w @terra/contracts
      - run: npm run check -w web
      - run: npm run lint -w web
      - run: npm run test -w web
      - run: npm run check -w site
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Start dependencies
        run: docker compose -f infra/dev/docker-compose.yml up -d --build --wait db centrifugo mailpit s3 temporal
      - name: Install typst (lease documents)
        run: |
          curl -fsSL -o /tmp/typst.tar.xz "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  /tmp/typst.tar.xz" | sha256sum -c -
          sudo tar -xJf /tmp/typst.tar.xz -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
      - name: Start api and worker
        run: |
          cd services/api
          go build -o bin/ ./cmd/...
          bin/migrate up
          bin/terractl seed-dev
          bin/terractl seed-search 500
          (bin/worker &) ; (bin/api &)
          for _ in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 2; done
        env:
          DATABASE_URL: postgres://terra:terra@localhost:5433/terra?sslmode=disable
          CENTRIFUGO_API_URL: http://localhost:8000/api
          CENTRIFUGO_API_KEY: dev-centrifugo-api-key
          MESSAGE_NOTIFY_DELAY: 2s
          TEMPORAL_ADDRESS: localhost:7233
          MIGRATE_ON_START: "true"
          SMTP_ADDR: localhost:1025
          S3_ENDPOINT: localhost:8333
          S3_ACCESS_KEY: terra
          S3_SECRET_KEY: terra-dev-secret
          WEB_BASE_URL: http://localhost:4173
          AUTH_RATE_BURST: "500"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          API_URL: http://localhost:8080
      - name: Static locality pages
        run: ./scripts/check-site.sh
        env:
          API_URL: http://localhost:8080

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze
      - run: flutter test

  vision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/vision
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: govulncheck (reachable Go vulnerabilities)
        working-directory: services/api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: npm audit (production dependencies, high and above)
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: pip-audit (services/vision)
        working-directory: services/vision
        run: |
          python -m venv /tmp/vision-audit
          /tmp/vision-audit/bin/pip install --quiet . pip-audit
          /tmp/vision-audit/bin/pip-audit --skip-editable --progress-spinner off
      - name: osv-scanner (lockfiles of all stacks)
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=services/api/go.mod
            --lockfile=apps/mobile/pubspec.lock
      - uses: hashicorp/setup-terraform@v3
        if: hashFiles('infra/hetzner/terraform/**/*.tf') != ''
        with:
          terraform_wrapper: false
      - name: terraform fmt
        if: hashFiles('infra/hetzner/terraform/**/*.tf') != ''
        run: terraform fmt -check -recursive infra/hetzner/terraform
      - name: terraform validate (no backend, no credentials)
        if: hashFiles('infra/hetzner/terraform/**/*.tf') != ''
        run: |
          terraform -chdir=infra/hetzner/terraform init -backend=false -input=false
          terraform -chdir=infra/hetzner/terraform validate

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [go, web, vision]
    permissions:
      contents: read
      packages: write
    env:
      # Push only when a registry token is configured (secrets are not readable in `if:` directly).
      REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
      # Must equal IMAGE_REGISTRY in infra/hetzner/compose/.env (images: $IMAGE_REGISTRY/terra/{api,web,vision}:$IMAGE_TAG).
      IMAGE_REGISTRY: ${{ vars.IMAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build terra/api (version info for /v1/version, logs and Sentry)
        run: |
          docker build -t terra/api \
            --build-arg VERSION="${GITHUB_SHA::12}" --build-arg COMMIT="$GITHUB_SHA" \
            --build-arg BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" services/api
      - run: docker build -f apps/web/Dockerfile -t terra/web .
      - run: docker build -t terra/vision services/vision
      - name: Log in to the image registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_TOKEN != ''
        run: |
          echo "$REGISTRY_TOKEN" | docker login "${IMAGE_REGISTRY%%/*}" \
            -u "${{ vars.REGISTRY_USER || github.actor }}" --password-stdin
      - name: Push images (tag = git sha + latest)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.REGISTRY_TOKEN != ''
        run: |
          registry=$(echo "$IMAGE_REGISTRY" | tr '[:upper:]' '[:lower:]')
          for name in api web vision; do
            for tag in "$GITHUB_SHA" latest; do
              docker tag "terra/$name" "$registry/terra/$name:$tag"
              docker push "$registry/terra/$name:$tag"
            done
          done
          echo "Deploy with IMAGE_REGISTRY=$registry IMAGE_TAG=$GITHUB_SHA (docs/runbooks/deploy.md)" >> "$GITHUB_STEP_SUMMARY"
