                  settled: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/bank:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [leasing]
      operationId: getBankOverview
      summary: Linked accounts and recent incoming transactions with their match status
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [unmatched, matched, suggested, ignored] } }
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankOverview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/bank/connections:
    post:
      tags: [leasing]
      operationId: connectBank
      summary: Link the landlord's account (open banking AIS, read only)
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uri]
              properties:
                institution_id: { type: string, maxLength: 100 }
                redirect_uri: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Connection (linked at once with the mock provider)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankLink" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/bank/connections/{connectionId}/finish:
    post:
      tags: [leasing]
      operationId: finishBankConnection
      summary: Complete linking after returning from the bank
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: connectionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BankConnection" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/bank/sync:
    post:
      tags: [leasing]
      operationId: syncBank
      summary: Fetch and match new transactions now
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: Result
          content:
            application/json:
              schema:
                type: object
                required: [new, matched, suggested]
                properties:
                  new: { type: integer }
                  matched: { type: integer }
                  suggested: { type: integer }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/bank/transactions/{transactionId}/match:
    post:
      tags: [leasing]
      operationId: matchBankTransaction
      summary: Confirm a suggested match or match manually; or ignore the transaction
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: transactionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                share_id: { type: string, format: uuid }
                ignore: { type: boolean }
      responses:
        "204": { description: Done }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio:
    get:
      tags: [portfolio]
      operationId: getPortfolio
      summary: Portfolio dashboard across municipalities (risk, concentration, income, attention, trend)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/PortfolioMunicipality" }
        - { $ref: "#/components/parameters/PortfolioRegion" }
        - { $ref: "#/components/parameters/PortfolioGroupFilter" }
      responses:
        "200":
          description: Dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDashboard" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/rent-roll:
    get:
      tags: [portfolio]
      operationId: getRentRoll
      summary: Rent roll of all units and running leases (JSON, CSV or XLSX)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/PortfolioMunicipality" }
        - { $ref: "#/components/parameters/PortfolioRegion" }
        - { $ref: "#/components/parameters/PortfolioGroupFilter" }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv, xlsx] } }
      responses:
        "200":
          description: Rent roll
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RentRoll" }
            text/csv:
              schema: { type: string }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/groups:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [portfolio]
      operationId: listPortfolioGroups
      summary: Groups (tags) of properties and leases
      responses:
        "200":
          description: Groups and the properties that can be added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioGroups" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [portfolio]
      operationId: createPortfolioGroup
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioGroupInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioGroup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/groups/{portfolioGroupId}:
    parameters:
      - { $ref: "#/components/parameters/OrgId" }
      - { $ref: "#/components/parameters/PortfolioGroupId" }
    put:
      tags: [portfolio]
      operationId: updatePortfolioGroup
      summary: Rename a group and replace its members
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioGroupInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioGroup" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [portfolio]
      operationId: deletePortfolioGroup
      summary: Delete a group (and its rules)
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/rules:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [portfolio]
      operationId: listPortfolioRules
      summary: Rules per municipality or group (overrides of the jurisdiction defaults)
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioRuleList" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [portfolio]
      operationId: savePortfolioRule
      summary: Set the rules of a municipality or a group (applies to new leases)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PortfolioRuleInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/rules/{ruleId}:
    delete:
      tags: [portfolio]
      operationId: deletePortfolioRule
      summary: Delete a rule
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/rules/resolve:
    get:
      tags: [portfolio]
      operationId: resolvePortfolioRules
      summary: Rules a new lease at a place would get (lease form defaults)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: listing_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: ruian_id, in: query, required: false, schema: { type: integer, format: int64 } }
        - { name: address, in: query, required: false, schema: { type: string, maxLength: 300 } }
      responses:
        "200":
          description: Resolved rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedRules" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/risk-weights:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [portfolio]
      operationId: getRiskWeights
      summary: Factor weights of the lease risk score
      responses:
        "200":
          description: Weights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskWeights" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [portfolio]
      operationId: setRiskWeights
      summary: Set factor weights (0 switches a factor off); leases are rescored
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weights]
              properties:
                weights: { type: object, additionalProperties: { type: integer, minimum: 0, maximum: 100 } }
      responses:
        "200":
          description: Weights
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskWeights" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/portfolio/summary:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [portfolio]
      operationId: getPortfolioSummary
      summary: The latest AI summary of the portfolio (a suggestion)
      responses:
        "200":
          description: Summary, absent when none was made
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary: { $ref: "#/components/schemas/PortfolioSummary" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [portfolio]
      operationId: createPortfolioSummary
      summary: Ask the AI to summarize the portfolio (aggregates only, no personal data)
      responses:
        "201":
          description: Summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioSummary" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/leases/{leaseId}/risk:
    get:
      tags: [portfolio]
      operationId: getLeaseRisk
      summary: Risk of a lease with its factors (tenants see only the payment factors)
      parameters: [{ $ref: "#/components/parameters/LeaseId" }]
      responses:
        "200":
          description: Risk
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaseRisk" }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ billing
  /v1/promo-products:
    get:
      tags: [billing]
      operationId: listPromoProducts
      summary: Active promotion products (topování, zvýraznění, balíček) with net, VAT and gross prices
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoProductList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/promotions/checkout:
    post:
      tags: [billing]
      operationId: createPromoCheckout
      summary: Order a promotion of a listing; pay by card on the returned Stripe Checkout page
      description: >-
        The order stays pending until the signed Stripe webhook confirms the payment. Stripe collects only
        the platform's own fee for promotion; rent never goes through the platform (ADR 0002).
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoCheckoutInput" }
      responses:
        "201":
          description: Pending order and the checkout page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoCheckout" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/promotions:
    get:
      tags: [billing]
      operationId: listPromotions
      summary: Paid promotion periods of a listing (running, scheduled and past)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      responses:
        "200":
          description: Promotions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromotionList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/orders:
    get:
      tags: [billing]
      operationId: listOrders
      summary: Promotion orders of the organization
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/orders/{orderId}:
    get:
      tags: [billing]
      operationId: getOrder
      summary: One order (the checkout success page polls it until paid)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/OrderId" }
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/invoices:
    get:
      tags: [billing]
      operationId: listInvoices
      summary: Invoices (daňové doklady) issued to the organization
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses:
        "200":
          description: Invoices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvoiceList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/invoices/{invoiceId}/pdf:
    get:
      tags: [billing]
      operationId: getInvoicePdf
      summary: The invoice as a PDF
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/InvoiceId" }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
  /v1/webhooks/stripe:
    post:
      security: []
      tags: [billing]
      operationId: stripeWebhook
      summary: Stripe events (checkout.session.completed and friends); verified by the Stripe-Signature header
      description: The raw body is needed to verify the signature, so it is accepted as bytes. Events are processed once.
      parameters:
        - { name: Stripe-Signature, in: header, required: false, description: "Checked by the handler; a missing header is rejected with 400.", schema: { type: string, maxLength: 2000 } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Accepted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/revolut:
    parameters: [{ $ref: "#/components/parameters/OrgId" }]
    get:
      tags: [billing]
      operationId: getRevolutAccount
      summary: The landlord's own Revolut Business merchant account (connection state only, never the key)
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevolutAccount" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [billing]
      operationId: putRevolutAccount
      summary: Connect the landlord's Revolut Business merchant API key (stored encrypted)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RevolutAccountInput" }
      responses:
        "200":
          description: Account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevolutAccount" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [billing]
      operationId: deleteRevolutAccount
      summary: Disconnect the Revolut account
      responses:
        "204": { description: Disconnected }
        default: { $ref: "#/components/responses/Problem" }
  /v1/obligation-shares/{shareId}/payment-link:
    parameters:
      - { name: shareId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [billing]
      operationId: getPaymentLink
      summary: The latest valid payment link of a share (404 when none)
      responses:
        "200":
          description: Payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [billing]
      operationId: createPaymentLink
      summary: Card payment link in the landlord's own Revolut merchant account (money goes landlord-direct)
      description: >-
        For the share's party and members of the owning organization. 409 when the organization has no
        Revolut account; 404 when the payments.revolut flag is off. The platform never holds the money (ADR 0002).
      responses:
        "201":
          description: Payment link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentLink" }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ backoffice (M7)
  /v1/backoffice/metrics:
    get:
      tags: [backoffice]
      operationId: backofficeGetMetrics
      summary: Platform metrics for the dashboard (staff)
      responses:
        "200":
          description: Metrics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackofficeMetrics" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/feature-flags:
    get:
      tags: [backoffice]
      operationId: backofficeListFeatureFlags
      summary: Feature flags with their source (database row or config default) (staff)
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlagList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/feature-flags/{key}:
    put:
      tags: [backoffice]
      operationId: backofficeSetFeatureFlag
      summary: Turn a feature flag on or off (staff, audited)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string, pattern: '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)*$', maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureFlagInput" }
      responses:
        "200":
          description: Flag
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeatureFlag" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/promo-products:
    get:
      tags: [backoffice]
      operationId: backofficeListPromoProducts
      summary: The promotion catalog including inactive products (staff)
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoProductList" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [backoffice]
      operationId: backofficeCreatePromoProduct
      summary: Add a promotion product (staff, audited)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoProductInput" }
      responses:
        "201":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoProduct" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/promo-products/{productId}:
    patch:
      tags: [backoffice]
      operationId: backofficeUpdatePromoProduct
      summary: Change price, duration, name or availability of a product (staff, audited)
      parameters:
        - { name: productId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PromoProductPatch" }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PromoProduct" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/attribute-suggestions:
    get:
      tags: [backoffice]
      operationId: backofficeListAttributeSuggestions
      summary: New attributes proposed by AI ingest, waiting for a staff decision (ADR 0003)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [open, approved, rejected], default: open } }
      responses:
        "200":
          description: Suggestions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeSuggestionList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/attribute-suggestions/{suggestionId}/decision:
    post:
      tags: [backoffice]
      operationId: backofficeDecideAttributeSuggestion
      summary: Approve or reject an AI-proposed attribute (staff, audited)
      description: >-
        A human decides (ADR 0003). Approval only records who approved it, when and the note; it does not change
        the attribute catalog, which a developer then extends in packages/attributes. A suggestion can be decided once.
      parameters:
        - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AttributeSuggestionDecision" }
      responses:
        "200":
          description: Decided suggestion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeSuggestion" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/templates:
    get:
      tags: [backoffice]
      operationId: backofficeListTemplates
      summary: Contract templates bundled with this release and their legal review state (staff)
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContractTemplateList" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/templates/{name}/preview:
    get:
      tags: [backoffice]
      operationId: backofficePreviewTemplate
      summary: Render a template with sample data as a PDF (staff)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9_-]+$', maxLength: 100 } }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema: { type: string, format: binary }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from an AuthResult. The web app keeps it in an HttpOnly cookie on its own origin and forwards it server-side; the mobile app keeps it in secure storage.
  parameters:
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple] } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 128 } }
    Before:
      name: before
      in: query
      required: false
      description: Cursor; return items with an id lower than this one.
      schema: { type: string, format: uuid }
    ListingId: { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
    OrderId: { name: orderId, in: path, required: true, schema: { type: string, format: uuid } }
    InvoiceId: { name: invoiceId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    LeaseId: { name: leaseId, in: path, required: true, schema: { type: string, format: uuid } }
    PortfolioGroupId: { name: portfolioGroupId, in: path, required: true, schema: { type: string, format: uuid } }
    PortfolioMunicipality: { name: municipality, in: query, required: false, description: Admin path of a municipality., schema: { type: string, maxLength: 200 } }
    PortfolioRegion: { name: region, in: query, required: false, description: Admin path of a region., schema: { type: string, maxLength: 200 } }
    PortfolioGroupFilter: { name: group_id, in: query, required: false, schema: { type: string, format: uuid } }
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthResult:
      description: Session created, or a second factor is required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResult" }
    Me:
      description: Current user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Listing:
      description: Listing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Listing" }
    OidcStart:
      description: Redirect the browser to authorization_url
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OidcStart" }
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail, disabled]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
    Version:
      type: object
      required: [version, commit, built_at, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
        schema_version:
          type: integer
          format: int64
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code for client-side translation, e.g. invalid_credentials.
          example: invalid_credentials
        errors:
          type: array
          description: Field errors (code invalid_fields).
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    # --- auth
    UserLocale: { type: string, enum: [cs, en] }
    Email: { type: string, format: email, maxLength: 254 }
    Password: { type: string, minLength: 10, maxLength: 200 }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
    RegisterRequest:
      type: object
      required: [email, password, display_name, accept_terms_version, accept_privacy_version]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: "#/components/schemas/UserLocale" }
        accept_terms_version: { type: string, minLength: 1, maxLength: 32 }
        accept_privacy_version: { type: string, minLength: 1, maxLength: 32 }
        marketing: { type: boolean, default: false }
        client: { $ref: "#/components/schemas/ClientKind" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 200 }
        client: { $ref: "#/components/schemas/ClientKind" }
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, minLength: 20, maxLength: 128 }
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: 6-digit TOTP code or a one-time recovery code.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        locale: { $ref: "#/components/schemas/UserLocale" }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        client: { $ref: "#/components/schemas/ClientKind" }
    PasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        password: { $ref: "#/components/schemas/Password" }
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
        session: { $ref: "#/components/schemas/SessionToken" }
        mfa_token:
          type: string
          description: Present when status is mfa_required; valid for 5 minutes.
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    AuthProvider:
      type: object
      required: [id, mock]
      properties:
        id: { type: string, enum: [google, apple] }
        mock: { type: boolean, description: True when the provider is the local mock IdP. }
    OidcStartRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri: { type: string, format: uri, maxLength: 500, description: Must be on the deployment allowlist. }
    OidcStart:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    OidcCallbackRequest:
      type: object
      required: [code, state, redirect_uri]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 20, maxLength: 128 }
        redirect_uri: { type: string, format: uri, maxLength: 500 }
        client: { $ref: "#/components/schemas/ClientKind" }
    # --- me
    VerificationLevel:
      type: string
      enum: [none, email, phone, identity]
      description: none → email → phone → identity (BankID). Features require a minimum level.
    Role:
      type: string
      enum: [owner, admin, agent, accountant, maintenance, viewer, investor]
      description: investor reads the portfolio (rent roll, risk, dashboard) and nothing else.
    Me:
      type: object
      required: [id, email, email_verified, display_name, locale, phone_verified, verification_level, mfa_enabled, is_staff, created_at, organizations]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
        locale: { $ref: "#/components/schemas/UserLocale" }
        phone: { type: string }
        phone_verified: { type: boolean }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        identity: { $ref: "#/components/schemas/VerifiedIdentity" }
        mfa_enabled: { type: boolean }
        recovery_codes_left: { type: integer }
        has_password: { type: boolean }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }
        impersonator: { $ref: "#/components/schemas/UserRef" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    VerifiedIdentity:
      type: object
      required: [provider, verified_at]
      properties:
        provider: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        birthdate: { type: string, format: date }
        verified_at: { type: string, format: date-time }
    UserRef:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
    UpdateMeRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: "#/components/schemas/UserLocale" }
    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string, maxLength: 200, description: Required when the account already has a password. }
        new_password: { $ref: "#/components/schemas/Password" }
    SessionInfo:
      type: object
      required: [id, client, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
        impersonated: { type: boolean }
    TotpSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: otpauth:// URI to render as a QR code. }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164 }
    ConsentKind: { type: string, enum: [terms, privacy, marketing] }
    ConsentInput:
      type: object
      required: [kind, version, granted]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string, minLength: 1, maxLength: 32 }
        granted: { type: boolean }
    Consent:
      type: object
      required: [id, kind, version, granted, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string }
        granted: { type: boolean }
        created_at: { type: string, format: date-time }
    GdprRequest:
      type: object
      required: [id, kind, status, scheduled_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [export, erasure] }
        status: { type: string, enum: [pending, processing, done, failed, cancelled, rejected] }
        scheduled_at: { type: string, format: date-time }
        detail: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    DownloadLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    # --- orgs
    Organization:
      type: object
      required: [id, kind, name, jurisdiction_code, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [personal, company] }
        name: { type: string }
        registration_no: { type: string }
        vat_no: { type: string }
        jurisdiction_code: { type: string }
        created_at: { type: string, format: date-time }
    OrgMembership:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }
    OrgInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        registration_no: { type: string, pattern: '^[0-9]{6,10}$' }
        vat_no: { type: string, maxLength: 20 }
        jurisdiction_code: { type: string, pattern: '^[A-Z]{2}$' }
    Member:
      type: object
      required: [user_id, email, display_name, role, verification_level, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        joined_at: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        role: { type: string, enum: [admin, agent, accountant, maintenance, viewer, investor] }
        locale: { $ref: "#/components/schemas/UserLocale" }
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [org_name, role, email, inviter_name, expires_at, status]
      properties:
        org_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string }
        inviter_name: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [open, accepted, revoked, expired] }
    AuditEvent:
      type: object
      required: [id, occurred_at, entity, action, diff]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_email: { type: string }
        impersonator_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        action: { type: string }
        diff: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_before: { type: string, format: uuid }
    # --- jurisdictions
    Jurisdiction:
      type: object
      required: [code, name, currency, default_locale, deposit_max_months, notice_period_months, signature_provider, identity_provider, address_format, rules]
      properties:
        code: { type: string }
        name: { type: object, additionalProperties: { type: string } }
        currency: { type: string }
        default_locale: { type: string }
        deposit_max_months: { type: integer }
        notice_period_months: { type: integer }
        signature_provider: { type: string }
        identity_provider: { type: string }
        address_format: { type: object, additionalProperties: true }
        rules: { type: object, additionalProperties: true }
    # --- backoffice
    AdminUser:
      type: object
      required: [id, email, display_name, verification_level, mfa_enabled, is_staff, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        mfa_enabled: { type: boolean }
        is_staff: { type: boolean }
        pseudonymized: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_before: { type: string, format: uuid }
    AdminUserDetail:
      type: object
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    ImpersonateRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: Stored in the audit log. }
    # --- catalog
    I18nText:
      type: object
      required: [cs, en]
      properties:
        cs: { type: string, maxLength: 10000 }
        en: { type: string, maxLength: 10000 }
    AttributeOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        source: { type: string, enum: [catalog, ingest] }
    AttributeDef:
      type: object
      required: [key, type, group, label, filter, applies_to, options]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, range, enum, set, text] }
        group: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        filter: { type: boolean }
        unit: { type: string }
        min: { type: number, format: double }
        max: { type: number, format: double }
        applies_to: { type: array, items: { $ref: "#/components/schemas/UnitKind" } }
        options: { type: array, items: { $ref: "#/components/schemas/AttributeOption" } }
    AttributeGroup:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
    AttributeSchema:
      type: object
      required: [groups, attributes]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/AttributeGroup" } }
        attributes: { type: array, items: { $ref: "#/components/schemas/AttributeDef" } }
    AddressSuggestion:
      type: object
      required: [ruian_id, label, municipality, postal_code, lat, lng]
      properties:
        ruian_id: { type: integer, format: int64 }
        label: { type: string }
        municipality: { type: string }
        district: { type: string }
        city_part: { type: string }
        street: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    UnitKind: { type: string, enum: [apartment, house, room, parking, storage, commercial] }
    ListingStatus: { type: string, enum: [draft, review, published, paused, rented, archived] }
    ListingCreate:
      type: object
      required: [ruian_id, unit_kind]
      properties:
        ruian_id: { type: integer, format: int64 }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
        parent_unit_id: { type: string, format: uuid, description: Rooms only – an existing apartment at the same address. }
        parent_layout: { type: string, maxLength: 20, description: Rooms only – layout of the apartment to create. }
        parent_floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
    ListingUpdate:
      type: object
      required: [title, description, attributes, location_precision]
      properties:
        title: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nText" }
        rent_amount: { type: integer, format: int64, minimum: 0, description: Minor units (haléře). }
        deposit_amount: { type: integer, format: int64, minimum: 0 }
        utilities_amount: { type: integer, format: int64, minimum: 0 }
        available_from: { type: string, format: date }
        min_term_months: { type: integer, format: int32, minimum: 0, maximum: 120 }
        attributes: { type: object, additionalProperties: true }
        location_precision: { type: string, enum: [exact, approximate] }
        unit_label: { type: string, minLength: 1, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
    ListingUnit:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/UnitKind" }
        label: { type: string }
        floor: { type: integer, format: int32 }
        floor_area: { type: number, format: double }
        layout: { type: string }
        parent_id: { type: string, format: uuid }
        parent_label: { type: string }
    ListingAddress:
      type: object
      required: [label, city, postal_code, lat, lng]
      properties:
        label: { type: string }
        city: { type: string }
        city_part: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    PhotoUrls:
      type: object
      additionalProperties: { type: string }
      description: Signed imgproxy URLs by variant (thumb 400px, medium 1024px, large 1920px).
    Media:
      type: object
      required: [id, status, filename, content_type, position, caption, urls]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploading, processing, ready, rejected] }
        rejection_reason: { type: string }
        filename: { type: string }
        content_type: { type: string }
        width: { type: integer, format: int32 }
        height: { type: integer, format: int32 }
        position: { type: integer, format: int32 }
        caption: { $ref: "#/components/schemas/I18nText" }
        urls: { $ref: "#/components/schemas/PhotoUrls" }
        room_type: { type: string }
        tags: { type: array, items: { type: string } }
    MediaUploadRequest:
      type: object
      required: [filename, content_type, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
    MediaUpload:
      type: object
      required: [media, upload_url, expires_at]
      properties:
        media: { $ref: "#/components/schemas/Media" }
        upload_url: { type: string, description: Presigned PUT URL; send the file body with its Content-Type. }
        expires_at: { type: string, format: date-time }
    MediaUpdate:
      type: object
      required: [position, caption]
      properties:
        position: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        caption: { $ref: "#/components/schemas/I18nText" }
    Suggestion:
      type: object
      required: [id, kind, status, payload, created_at]
      description: AI output. Applied to the listing only after the owner accepts it.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [attributes, text, photo_tags, privacy_blur] }
        status: { type: string, enum: [generating, pending, accepted, partially_accepted, rejected, failed] }
        media_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        model: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    SuggestionDecision:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
        keys:
          type: array
          items: { type: string }
          description: Attribute suggestions only – accept just these attributes.
    ListingVersionInfo:
      type: object
      required: [id, version, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        review_note: { type: string }
    ListingSummary:
      type: object
      required: [id, status, title, unit_kind, unit_label, address_label, currency, pending_review, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ListingStatus" }
        title: { $ref: "#/components/schemas/I18nText" }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string }
        address_label: { type: string }
        rent_amount: { type: integer, format: int64 }
        currency: { type: string }
        cover_url: { type: string }
        pending_review: { type: boolean }
        published_version: { type: integer, format: int32 }
        updated_at: { type: string, format: date-time }
    Listing:
      type: object
      required: [id, org_id, status, title, description, currency, attributes, location_precision, pending_review,
        unit, property_id, address, media, suggestions, versions, deposit_max_months, created_at, updated_at, prescreen]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        prescreen: { type: array, items: { $ref: "#/components/schemas/PrescreenQuestion" } }
