                type: array
                items: { $ref: "#/components/schemas/PushDevice" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [me]
      operationId: registerPushDevice
      summary: Register an FCM token or a web push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushDeviceInput" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PushDevice" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/push-devices/{deviceId}:
    delete:
      tags: [me]
      operationId: deletePushDevice
      summary: Unregister a push device
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/moderation:
    get:
      tags: [backoffice]
      operationId: backofficeListModeration
      summary: Open reports and automatic flags, oldest first
      responses:
        "200":
          description: Cases
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModerationCase" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/moderation/{caseId}:
    get:
      tags: [backoffice]
      operationId: backofficeGetModeration
      summary: A case with the conversation transcript and the AI suggestion
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Case
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModerationCaseDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/moderation/{caseId}/decision:
    post:
      tags: [backoffice]
      operationId: backofficeDecideModeration
      summary: Resolve a case (human decision; the AI verdict is only a suggestion)
      parameters:
        - { name: caseId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { $ref: "#/components/schemas/ModerationVerdict" }
                note: { type: string, maxLength: 2000 }
      responses:
        "204": { description: Resolved }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups:
    get:
      tags: [applications]
      operationId: listMyGroups
      summary: Groups I belong to or am invited to
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupSummary" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [applications]
      operationId: createGroup
      summary: Create a tenant group and invite flatmates by e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                invite: { type: array, maxItems: 9, items: { type: string, format: email } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups/{groupId}:
    get:
      tags: [applications]
      operationId: getGroup
      summary: Group with members and chat (chat only for joined members)
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "200":
          description: Group
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups/{groupId}/invitations:
    post:
      tags: [applications]
      operationId: inviteToGroup
      summary: Invite a flatmate by e-mail
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204": { description: Invited }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups/{groupId}/join:
    post:
      tags: [applications]
      operationId: joinGroup
      summary: Accept an invitation (consent to act as a member of the group)
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "204": { description: Joined }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups/{groupId}/leave:
    post:
      tags: [applications]
      operationId: leaveGroup
      summary: Leave a group
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      responses:
        "204": { description: Left }
        default: { $ref: "#/components/responses/Problem" }
  /v1/groups/{groupId}/messages:
    post:
      tags: [applications]
      operationId: sendGroupMessage
      summary: Post to the group chat
      parameters: [{ $ref: "#/components/parameters/GroupId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201":
          description: Sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMessage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/applications:
    get:
      tags: [applications]
      operationId: listMyApplications
      summary: My applications, including my groups' applications
      responses:
        "200":
          description: Applications
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Application" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [applications]
      operationId: createApplication
      summary: Apply for a listing, alone or as a group (a group application waits for every member's consent)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/applications/{applicationId}:
    get:
      tags: [applications]
      operationId: getApplication
      summary: Application with consents, bookable viewing slots and my booking
      parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
      responses:
        "200":
          description: Application
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplicationDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/applications/{applicationId}/consent:
    post:
      tags: [applications]
      operationId: consentApplication
      summary: Consent to a group application; the last consent submits it
      parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
      responses:
        "204": { description: Consented }
        default: { $ref: "#/components/responses/Problem" }
  /v1/applications/{applicationId}/withdraw:
    post:
      tags: [applications]
      operationId: withdrawApplication
      summary: Withdraw my application
      parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
      responses:
        "204": { description: Withdrawn }
        default: { $ref: "#/components/responses/Problem" }
  /v1/applications/{applicationId}/bookings:
    post:
      tags: [applications]
      operationId: bookViewing
      summary: Book a viewing slot (replaces an earlier booking of this application)
      parameters: [{ $ref: "#/components/parameters/ApplicationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slot_id]
              properties:
                slot_id: { type: string, format: uuid }
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Problem" }
  /v1/viewing-bookings/{bookingId}:
    delete:
      tags: [applications]
      operationId: cancelViewing
      summary: Cancel a booked viewing
      parameters:
        - { name: bookingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Cancelled }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/viewings:
    get:
      tags: [applications]
      operationId: listMyViewings
      summary: My upcoming viewings
      responses:
        "200":
          description: Viewings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Viewing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/roommate-profile:
    get:
      tags: [applications]
      operationId: getRoommateProfile
      summary: My "looking for a flatmate" profile (404 when none)
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoommateProfile" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [applications]
      operationId: saveRoommateProfile
      summary: Create or update my roommate profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoommateProfile" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoommateProfile" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/roommates:
    get:
      tags: [applications]
      operationId: listRoommates
      summary: Other seekers ranked by match with my profile
      parameters:
        - { name: area, in: query, required: false, description: Admin unit path., schema: { type: string } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoommateMatch" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/passport:
    get:
      tags: [applications]
      operationId: getPassport
      summary: My Tenant Passport
      responses:
        "200":
          description: Passport
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/passport/income:
    post:
      tags: [applications]
      operationId: createIncomeUpload
      summary: Reserve an upload for an income proof (PUT the file, then complete)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type: { type: string, enum: [application/pdf, image/jpeg, image/png] }
                size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
      responses:
        "201":
          description: Upload slot
          content:
            application/json:
              schema:
                type: object
                required: [key, upload_url]
                properties:
                  key: { type: string }
                  upload_url: { type: string }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [applications]
      operationId: deleteIncomeProof
      summary: Remove my income proof
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/passport/income/complete:
    post:
      tags: [applications]
      operationId: completeIncomeUpload
      summary: Check the uploaded income proof and attach it to the passport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, filename]
              properties:
                key: { type: string, maxLength: 200 }
                filename: { type: string, minLength: 1, maxLength: 255 }
      responses:
        "200":
          description: Passport
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/passport/insolvency-check:
    post:
      tags: [applications]
      operationId: checkInsolvency
      summary: Check the insolvency register (needs a verified identity; once a day)
      responses:
        "200":
          description: Passport
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Passport" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/applications:
    get:
      tags: [applications]
      operationId: listListingApplications
      summary: Applicants of a listing, verified first, with passport facts and the AI summary
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      responses:
        "200":
          description: Applicants
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Applicant" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/applications/{applicationId}/decision:
    post:
      tags: [applications]
      operationId: decideApplication
      summary: Invite to a viewing, accept (other applicants get an automatic answer) or reject with a reason code
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ApplicationId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [invite, accept, reject] }
                reason: { $ref: "#/components/schemas/RejectReason" }
      responses:
        "204": { description: Decided }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/viewing-slots:
    get:
      tags: [applications]
      operationId: listViewingSlots
      summary: Upcoming viewing slots with bookings
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      responses:
        "200":
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ViewingSlot" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [applications]
      operationId: createViewingSlot
      summary: Offer a viewing slot
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at]
              properties:
                starts_at: { type: string, format: date-time }
                duration_min: { type: integer, minimum: 5, maximum: 240, default: 20 }
                capacity: { type: integer, minimum: 1, maximum: 50, default: 1 }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ViewingSlot" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/viewing-slots/{slotId}:
    delete:
      tags: [applications]
      operationId: deleteViewingSlot
      summary: Remove a slot (its bookings are cancelled)
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { name: slotId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/roommates:
    get:
      tags: [applications]
      operationId: listListingRoommates
      summary: Seekers who match a published room listing
      parameters:
        - { $ref: "#/components/parameters/OrgId" }
        - { $ref: "#/components/parameters/ListingId" }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RoommateMatch" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from an AuthResult. The web app keeps it in an HttpOnly cookie on its own origin and forwards it server-side; the mobile app keeps it in secure storage.
  parameters:
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple] } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 128 } }
    Before:
      name: before
      in: query
      required: false
      description: Cursor; return items with an id lower than this one.
      schema: { type: string, format: uuid }
    ListingId: { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    GroupId: { name: groupId, in: path, required: true, schema: { type: string, format: uuid } }
    ApplicationId: { name: applicationId, in: path, required: true, schema: { type: string, format: uuid } }
    ConversationId: { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthResult:
      description: Session created, or a second factor is required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResult" }
    Me:
      description: Current user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Listing:
      description: Listing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Listing" }
    OidcStart:
      description: Redirect the browser to authorization_url
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OidcStart" }
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail, disabled]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
    Version:
      type: object
      required: [version, commit, built_at, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
        schema_version:
          type: integer
          format: int64
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code for client-side translation, e.g. invalid_credentials.
          example: invalid_credentials
        errors:
          type: array
          description: Field errors (code invalid_fields).
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    # --- auth
    UserLocale: { type: string, enum: [cs, en] }
    Email: { type: string, format: email, maxLength: 254 }
    Password: { type: string, minLength: 10, maxLength: 200 }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
    RegisterRequest:
      type: object
      required: [email, password, display_name, accept_terms_version, accept_privacy_version]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: "#/components/schemas/UserLocale" }
        accept_terms_version: { type: string, minLength: 1, maxLength: 32 }
        accept_privacy_version: { type: string, minLength: 1, maxLength: 32 }
        marketing: { type: boolean, default: false }
        client: { $ref: "#/components/schemas/ClientKind" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 200 }
        client: { $ref: "#/components/schemas/ClientKind" }
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, minLength: 20, maxLength: 128 }
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: 6-digit TOTP code or a one-time recovery code.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        locale: { $ref: "#/components/schemas/UserLocale" }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        client: { $ref: "#/components/schemas/ClientKind" }
    PasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        password: { $ref: "#/components/schemas/Password" }
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
        session: { $ref: "#/components/schemas/SessionToken" }
        mfa_token:
          type: string
          description: Present when status is mfa_required; valid for 5 minutes.
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    AuthProvider:
      type: object
      required: [id, mock]
      properties:
        id: { type: string, enum: [google, apple] }
        mock: { type: boolean, description: True when the provider is the local mock IdP. }
    OidcStartRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri: { type: string, format: uri, maxLength: 500, description: Must be on the deployment allowlist. }
    OidcStart:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    OidcCallbackRequest:
      type: object
      required: [code, state, redirect_uri]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 20, maxLength: 128 }
        redirect_uri: { type: string, format: uri, maxLength: 500 }
        client: { $ref: "#/components/schemas/ClientKind" }
    # --- me
    VerificationLevel:
      type: string
      enum: [none, email, phone, identity]
      description: none → email → phone → identity (BankID). Features require a minimum level.
    Role:
      type: string
      enum: [owner, admin, agent, accountant, maintenance, viewer]
    Me:
      type: object
      required: [id, email, email_verified, display_name, locale, phone_verified, verification_level, mfa_enabled, is_staff, created_at, organizations]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
        locale: { $ref: "#/components/schemas/UserLocale" }
        phone: { type: string }
        phone_verified: { type: boolean }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        identity: { $ref: "#/components/schemas/VerifiedIdentity" }
        mfa_enabled: { type: boolean }
        recovery_codes_left: { type: integer }
        has_password: { type: boolean }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }
        impersonator: { $ref: "#/components/schemas/UserRef" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    VerifiedIdentity:
      type: object
      required: [provider, verified_at]
      properties:
        provider: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        birthdate: { type: string, format: date }
