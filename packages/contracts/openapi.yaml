        payee_name: { type: string }
        due_day: { type: integer }
        notice_months: { type: integer }
        deposit_amount: { type: integer, format: int64 }
        services_amount: { type: integer, format: int64 }
        clauses: { type: array, items: { type: string } }
        change_request: { type: string }
        parties: { type: array, items: { $ref: "#/components/schemas/LeaseParty" } }
        documents: { type: array, items: { $ref: "#/components/schemas/LeaseDocument" } }
        total_debt: { type: integer, format: int64 }
    ObligationShare:
      type: object
      required: [id, obligation_id, kind, period, due_on, amount, paid_amount, currency, party_id, party_name, mine, status]
      properties:
        id: { type: string, format: uuid, description: Share id. }
