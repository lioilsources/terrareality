            floor_area: { type: number, format: double }
        location:
          type: object
          required: [lat, lng, precision]
          properties:
            lat: { type: number, format: double }
            lng: { type: number, format: double }
            precision: { type: string, enum: [exact, approximate] }
            address: { type: string, description: Only when the owner chose the exact location. }
        area_names: { type: array, items: { type: string }, description: From region to neighbourhood. }
