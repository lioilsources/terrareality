      parameters:
        - { name: savedSearchId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Deleted }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations:
    get:
      tags: [messaging]
      operationId: listConversations
      summary: My conversations (as a seeker and for my organizations), newest first
      parameters:
        - { name: org_id, in: query, required: false, description: Only this organization's inbox., schema: { type: string, format: uuid } }
        - { name: as, in: query, required: false, description: "seeker = only conversations I started.", schema: { type: string, enum: [seeker] } }
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Conversation" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [messaging]
      operationId: startConversation
      summary: Contact the landlord of a published listing (reuses an existing conversation)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartConversation" }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}:
    get:
      tags: [messaging]
      operationId: getConversation
      summary: Conversation with read receipts and pre-screening answers
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversationDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/messages:
    get:
      tags: [messaging]
      operationId: listMessages
      summary: Messages, newest first
      parameters:
        - { $ref: "#/components/parameters/ConversationId" }
        - { name: before, in: query, required: false, description: Return messages older than this time., schema: { type: string, format: date-time } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Message" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [messaging]
      operationId: sendMessage
      summary: Send a message. Contact details are masked and flagged, never blocked.
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SentMessage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/read:
    post:
      tags: [messaging]
      operationId: markConversationRead
      summary: Mark the conversation read up to now (read receipt)
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      responses:
        "204": { description: Marked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/block:
    put:
      tags: [messaging]
      operationId: setConversationBlocked
      summary: Block or unblock the conversation
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocked]
              properties:
                blocked: { type: boolean }
      responses:
        "204": { description: Saved }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/reports:
    post:
      tags: [messaging]
      operationId: reportConversation
      summary: Report the conversation or one message to the moderators
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportInput" }
      responses:
        "201":
          description: Report filed
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/attachments:
    post:
      tags: [messaging]
      operationId: createAttachmentUpload
      summary: Reserve an attachment and get a presigned upload URL (PUT the file there, then complete)
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, content_type, size_bytes]
              properties:
                filename: { type: string, minLength: 1, maxLength: 255 }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, application/pdf] }
                size_bytes: { type: integer, format: int64, minimum: 1, maximum: 10485760 }
      responses:
        "201":
          description: Upload slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUpload" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/attachments/{attachmentId}/complete:
    post:
      tags: [messaging]
      operationId: completeAttachmentUpload
      summary: Check the uploaded file (type, size, malware) so it can be sent
      parameters:
        - { name: attachmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Ready to send
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/conversations/{conversationId}/realtime-token:
    post:
      tags: [messaging]
      operationId: conversationRealtimeToken
      summary: Subscription token for the conversation's realtime channel
      parameters: [{ $ref: "#/components/parameters/ConversationId" }]
      responses:
        "200":
          description: Token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SubscriptionToken" }
        default: { $ref: "#/components/responses/Problem" }
