        id: { type: string, format: uuid }
        client: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
        impersonated: { type: boolean }
    TotpSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: otpauth:// URI to render as a QR code. }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164 }
    ConsentKind: { type: string, enum: [terms, privacy, marketing] }
    ConsentInput:
      type: object
      required: [kind, version, granted]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string, minLength: 1, maxLength: 32 }
        granted: { type: boolean }
    Consent:
      type: object
      required: [id, kind, version, granted, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string }
        granted: { type: boolean }
        created_at: { type: string, format: date-time }
    GdprRequest:
      type: object
      required: [id, kind, status, scheduled_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [export, erasure] }
        status: { type: string, enum: [pending, processing, done, failed, cancelled, rejected] }
        scheduled_at: { type: string, format: date-time }
        detail: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    DownloadLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    # --- orgs
    Organization:
      type: object
      required: [id, kind, name, jurisdiction_code, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [personal, company] }
        name: { type: string }
        registration_no: { type: string }
        vat_no: { type: string }
        jurisdiction_code: { type: string }
        created_at: { type: string, format: date-time }
    OrgMembership:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }
    OrgInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        registration_no: { type: string, pattern: '^[0-9]{6,10}$' }
        vat_no: { type: string, maxLength: 20 }
        jurisdiction_code: { type: string, pattern: '^[A-Z]{2}$' }
    Member:
      type: object
      required: [user_id, email, display_name, role, verification_level, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        joined_at: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        role: { type: string, enum: [admin, agent, accountant, maintenance, viewer] }
        locale: { $ref: "#/components/schemas/UserLocale" }
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [org_name, role, email, inviter_name, expires_at, status]
      properties:
        org_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string }
        inviter_name: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [open, accepted, revoked, expired] }
    AuditEvent:
      type: object
      required: [id, occurred_at, entity, action, diff]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_email: { type: string }
        impersonator_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        action: { type: string }
        diff: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_before: { type: string, format: uuid }
    # --- jurisdictions
    Jurisdiction:
      type: object
      required: [code, name, currency, default_locale, deposit_max_months, notice_period_months, signature_provider, identity_provider, address_format, rules]
      properties:
        code: { type: string }
        name: { type: object, additionalProperties: { type: string } }
        currency: { type: string }
        default_locale: { type: string }
        deposit_max_months: { type: integer }
        notice_period_months: { type: integer }
        signature_provider: { type: string }
        identity_provider: { type: string }
        address_format: { type: object, additionalProperties: true }
        rules: { type: object, additionalProperties: true }
    # --- backoffice
    AdminUser:
      type: object
      required: [id, email, display_name, verification_level, mfa_enabled, is_staff, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        mfa_enabled: { type: boolean }
        is_staff: { type: boolean }
        pseudonymized: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_before: { type: string, format: uuid }
    AdminUserDetail:
      type: object
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    ImpersonateRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: Stored in the audit log. }
    # --- catalog
    I18nText:
      type: object
      required: [cs, en]
      properties:
        cs: { type: string, maxLength: 10000 }
        en: { type: string, maxLength: 10000 }
    AttributeOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        source: { type: string, enum: [catalog, ingest] }
    AttributeDef:
      type: object
      required: [key, type, group, label, filter, applies_to, options]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, range, enum, set, text] }
        group: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        filter: { type: boolean }
        unit: { type: string }
        min: { type: number, format: double }
        max: { type: number, format: double }
        applies_to: { type: array, items: { $ref: "#/components/schemas/UnitKind" } }
        options: { type: array, items: { $ref: "#/components/schemas/AttributeOption" } }
    AttributeGroup:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
    AttributeSchema:
      type: object
      required: [groups, attributes]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/AttributeGroup" } }
        attributes: { type: array, items: { $ref: "#/components/schemas/AttributeDef" } }
    AddressSuggestion:
      type: object
      required: [ruian_id, label, municipality, postal_code, lat, lng]
      properties:
        ruian_id: { type: integer, format: int64 }
        label: { type: string }
        municipality: { type: string }
        district: { type: string }
        city_part: { type: string }
        street: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    UnitKind: { type: string, enum: [apartment, house, room, parking, storage, commercial] }
    ListingStatus: { type: string, enum: [draft, review, published, paused, rented, archived] }
    ListingCreate:
      type: object
      required: [ruian_id, unit_kind]
      properties:
        ruian_id: { type: integer, format: int64 }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
        parent_unit_id: { type: string, format: uuid, description: Rooms only – an existing apartment at the same address. }
        parent_layout: { type: string, maxLength: 20, description: Rooms only – layout of the apartment to create. }
        parent_floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
    ListingUpdate:
      type: object
      required: [title, description, attributes, location_precision]
      properties:
        title: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nText" }
        rent_amount: { type: integer, format: int64, minimum: 0, description: Minor units (haléře). }
        deposit_amount: { type: integer, format: int64, minimum: 0 }
        utilities_amount: { type: integer, format: int64, minimum: 0 }
        available_from: { type: string, format: date }
        min_term_months: { type: integer, format: int32, minimum: 0, maximum: 120 }
        attributes: { type: object, additionalProperties: true }
        location_precision: { type: string, enum: [exact, approximate] }
        unit_label: { type: string, minLength: 1, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
    ListingUnit:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/UnitKind" }
        label: { type: string }
        floor: { type: integer, format: int32 }
        floor_area: { type: number, format: double }
        layout: { type: string }
        parent_id: { type: string, format: uuid }
        parent_label: { type: string }
    ListingAddress:
      type: object
      required: [label, city, postal_code, lat, lng]
      properties:
        label: { type: string }
        city: { type: string }
        city_part: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    PhotoUrls:
      type: object
      additionalProperties: { type: string }
      description: Signed imgproxy URLs by variant (thumb 400px, medium 1024px, large 1920px).
    Media:
      type: object
      required: [id, status, filename, content_type, position, caption, urls]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploading, processing, ready, rejected] }
        rejection_reason: { type: string }
        filename: { type: string }
        content_type: { type: string }
        width: { type: integer, format: int32 }
        height: { type: integer, format: int32 }
        position: { type: integer, format: int32 }
        caption: { $ref: "#/components/schemas/I18nText" }
        urls: { $ref: "#/components/schemas/PhotoUrls" }
        room_type: { type: string }
        tags: { type: array, items: { type: string } }
    MediaUploadRequest:
      type: object
      required: [filename, content_type, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
    MediaUpload:
      type: object
      required: [media, upload_url, expires_at]
      properties:
        media: { $ref: "#/components/schemas/Media" }
        upload_url: { type: string, description: Presigned PUT URL; send the file body with its Content-Type. }
        expires_at: { type: string, format: date-time }
    MediaUpdate:
      type: object
      required: [position, caption]
      properties:
        position: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        caption: { $ref: "#/components/schemas/I18nText" }
    Suggestion:
      type: object
      required: [id, kind, status, payload, created_at]
      description: AI output. Applied to the listing only after the owner accepts it.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [attributes, text, photo_tags, privacy_blur] }
        status: { type: string, enum: [generating, pending, accepted, partially_accepted, rejected, failed] }
        media_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        model: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    SuggestionDecision:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
        keys:
          type: array
          items: { type: string }
          description: Attribute suggestions only – accept just these attributes.
    ListingVersionInfo:
      type: object
      required: [id, version, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        review_note: { type: string }
    ListingSummary:
      type: object
      required: [id, status, title, unit_kind, unit_label, address_label, currency, pending_review, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ListingStatus" }
        title: { $ref: "#/components/schemas/I18nText" }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string }
        address_label: { type: string }
        rent_amount: { type: integer, format: int64 }
        currency: { type: string }
        cover_url: { type: string }
        pending_review: { type: boolean }
        published_version: { type: integer, format: int32 }
        updated_at: { type: string, format: date-time }
    Listing:
      type: object
      required: [id, org_id, status, title, description, currency, attributes, location_precision, pending_review,
        unit, property_id, address, media, suggestions, versions, deposit_max_months, created_at, updated_at, prescreen]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        prescreen: { type: array, items: { $ref: "#/components/schemas/PrescreenQuestion" } }
        status: { $ref: "#/components/schemas/ListingStatus" }
        title: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nText" }
        rent_amount: { type: integer, format: int64 }
        deposit_amount: { type: integer, format: int64 }
        utilities_amount: { type: integer, format: int64 }
        currency: { type: string }
        available_from: { type: string, format: date }
        min_term_months: { type: integer, format: int32 }
        attributes: { type: object, additionalProperties: true }
        location_precision: { type: string, enum: [exact, approximate] }
        published_version: { type: integer, format: int32 }
        published_at: { type: string, format: date-time }
        pending_review: { type: boolean }
        unit: { $ref: "#/components/schemas/ListingUnit" }
        property_id: { type: string, format: uuid }
        address: { $ref: "#/components/schemas/ListingAddress" }
        media: { type: array, items: { $ref: "#/components/schemas/Media" } }
        suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        versions: { type: array, items: { $ref: "#/components/schemas/ListingVersionInfo" } }
        deposit_max_months: { type: integer, description: Jurisdiction cap for the deposit in monthly rents. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReviewItem:
      type: object
      required: [version_id, listing_id, org_id, org_name, version, submitted_at, submitted_by_email, title, first_publication]
      properties:
        version_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        version: { type: integer, format: int32 }
        submitted_at: { type: string, format: date-time }
        submitted_by_email: { type: string }
        title: { $ref: "#/components/schemas/I18nText" }
        first_publication: { type: boolean }
        cover_url: { type: string }
    ReviewDetail:
      type: object
      required: [item, snapshot, photos]
      properties:
        item: { $ref: "#/components/schemas/ReviewItem" }
        snapshot: { type: object, additionalProperties: true }
        photos:
          type: array
          items: { $ref: "#/components/schemas/PhotoVariants" }
    PhotoVariants:
      type: object
      required: [thumb, medium, large]
      properties:
        thumb: { type: string }
        medium: { type: string }
        large: { type: string }
    ReviewDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        note: { type: string, maxLength: 2000, description: Shown to the owner; required when rejecting. }
    FilterProposal:
      type: object
      required: [id, attribute_key, value, label, occurrences, status, created_at]
      properties:
        id: { type: string, format: uuid }
        attribute_key: { type: string }
        value: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        occurrences: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        example_listing_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ProposalDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        label: { $ref: "#/components/schemas/I18nText" }
        note: { type: string, maxLength: 2000 }
    # --- search
    AttrFilter:
      type: object
      properties:
        values: { type: array, items: { type: string }, maxItems: 30 }
        bool: { type: boolean }
        min: { type: number, format: double }
        max: { type: number, format: double }
    SearchQuery:
      type: object
      properties:
        text: { type: string, maxLength: 200 }
        kinds: { type: array, items: { $ref: "#/components/schemas/UnitKind" } }
        rent_min: { type: integer, format: int64, minimum: 0, description: Minor units. }
        rent_max: { type: integer, format: int64, minimum: 0 }
        area_min: { type: number, format: double, minimum: 0 }
        area_max: { type: number, format: double, minimum: 0 }
        layouts: { type: array, items: { type: string, maxLength: 10 }, maxItems: 20 }
        admin_path: { type: string, maxLength: 300, pattern: '^[a-z0-9_.]*$' }
        bbox:
          type: array
          items: { type: number, format: double }
          minItems: 4
          maxItems: 4
          description: west, south, east, north
        attributes: { type: object, additionalProperties: { $ref: "#/components/schemas/AttrFilter" } }
        sort: { type: string, enum: [relevance, price_asc, price_desc, newest, area_desc] }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0, maximum: 10000 }
    ListingCard:
      type: object
      required: [id, unit_kind, rent_amount, currency, title, city, lat, lng, published_at]
      properties:
        id: { type: string, format: uuid }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        layout: { type: string }
        rent_amount: { type: integer, format: int64 }
        currency: { type: string }
        floor_area: { type: number, format: double }
        title: { $ref: "#/components/schemas/I18nText" }
        city: { type: string }
        city_part: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        cover_url: { type: string }
        published_at: { type: string, format: date-time }
    FacetCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }
    AreaAggregate:
      type: object
      required: [path, name, level, count, median_rent, lat, lng]
      properties:
        path: { type: string }
        name: { type: string }
        level: { type: integer }
        count: { type: integer }
        median_rent: { type: integer, format: int64 }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    MapPoint:
      type: object
      required: [id, lat, lng, rent_amount]
      properties:
        id: { type: string, format: uuid }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        rent_amount: { type: integer, format: int64 }
    SearchResult:
      type: object
      required: [total, items, facets, rent_min, rent_max, areas, points]
      properties:
        total: { type: integer }
        items: { type: array, items: { $ref: "#/components/schemas/ListingCard" } }
        facets: { type: object, additionalProperties: { type: array, items: { $ref: "#/components/schemas/FacetCount" } } }
        rent_min: { type: integer, format: int64 }
        rent_max: { type: integer, format: int64 }
        areas: { type: array, items: { $ref: "#/components/schemas/AreaAggregate" } }
        points: { type: array, items: { $ref: "#/components/schemas/MapPoint" }, description: Up to 2000 markers. }
    Place:
      type: object
      required: [path, name, bbox]
      properties:
        path: { type: string }
        name: { type: string }
        bbox: { type: array, items: { type: number, format: double } }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 500 }
        query: { $ref: "#/components/schemas/SearchQuery" }
        locale: { $ref: "#/components/schemas/UserLocale" }
    ChatResponse:
      type: object
      required: [query, reply, model, degraded, result]
      properties:
        query: { $ref: "#/components/schemas/SearchQuery" }
        place: { $ref: "#/components/schemas/Place" }
