        ends_on: { type: string, format: date }
        rent_amount: { type: integer, format: int64, minimum: 1 }
        services_amount: { type: integer, format: int64, minimum: 0 }
        deposit_amount: { type: integer, format: int64, minimum: 0 }
        due_day: { type: integer, minimum: 1, maximum: 28, default: 15 }
        notice_months: { type: integer, minimum: 1, maximum: 12, description: "Default: the portfolio rules of the place, else 3." }
