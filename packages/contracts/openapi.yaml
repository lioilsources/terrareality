        kind: { type: string, enum: [rent, services, deposit, oneoff] }
        period: { type: string }
        due_on: { type: string, format: date }
        amount: { type: integer, format: int64 }
        paid_amount: { type: integer, format: int64 }
        currency: { type: string }
        party_id: { type: string, format: uuid }
        party_name: { type: string }
        mine: { type: boolean }
        status: { type: string, enum: [open, paid, cancelled] }
        spayd: { type: string, description: QR Platba payload for the open amount. }
    LedgerEntry:
      type: object
      required: [posting_id, account, amount, memo, booked_on]
