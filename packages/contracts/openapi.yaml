openapi: 3.0.3
info:
  title: TerraReality API
  version: 0.1.0
  description: |
    Public and internal HTTP API of TerraReality. This file is the source of truth:
    the Go server stubs, the TypeScript client and the Dart client are generated from it
    (`make gen`). Errors are returned as RFC 9457 `application/problem+json`.
servers:
  - url: http://localhost:8080
    description: local dev
tags:
  - name: system
  - name: auth
  - name: me
  - name: orgs
  - name: jurisdictions
  - name: backoffice
  - name: catalog
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      tags: [system]
      operationId: getHealth
      summary: Liveness and dependency health
      responses:
        "200":
          description: Service and dependencies are healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one dependency is unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/version:
    get:
      security: []
      tags: [system]
      operationId: getVersion
      summary: Build information
      responses:
        "200":
          description: Build info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        default:
          $ref: "#/components/responses/Problem"
  # ------------------------------------------------------------------ auth
  /v1/auth/register:
    post:
      security: []
      tags: [auth]
      operationId: register
      summary: Create an account with e-mail and password
      description: Creates the user and their personal organization, records consents and sends a verification e-mail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/login:
    post:
      security: []
      tags: [auth]
      operationId: login
      summary: Log in with e-mail and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/mfa:
    post:
      security: []
      tags: [auth]
      operationId: completeMfa
      summary: Complete a login that requires a second factor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/magic-link:
    post:
      security: []
      tags: [auth]
      operationId: requestMagicLink
      summary: E-mail a one-time login link (creates the account if needed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "202": { description: Accepted; always returned to avoid account enumeration }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/magic-link/verify:
    post:
      security: []
      tags: [auth]
      operationId: verifyMagicLink
      summary: Exchange a magic link token for a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/email/verify:
    post:
      security: []
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an e-mail address with the token from the verification e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204": { description: E-mail verified }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/email/resend:
    post:
      tags: [auth]
      operationId: resendEmailVerification
      summary: Send the verification e-mail again
      responses:
        "202": { description: Sent unless already verified }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/password/forgot:
    post:
      security: []
      tags: [auth]
      operationId: forgotPassword
      summary: E-mail a password reset link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MagicLinkRequest" }
      responses:
        "202": { description: Accepted; always returned to avoid account enumeration }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/password/reset:
    post:
      security: []
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset token; revokes all sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "204": { description: Password changed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/providers:
    get:
      security: []
      tags: [auth]
      operationId: listAuthProviders
      summary: Social login providers enabled on this deployment
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuthProvider" }
  /v1/auth/oidc/{provider}/start:
    post:
      security: []
      tags: [auth]
      operationId: startOidc
      summary: Begin a social login; returns the provider authorization URL
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200": { $ref: "#/components/responses/OidcStart" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/oidc/{provider}/callback:
    post:
      security: []
      tags: [auth]
      operationId: finishOidc
      summary: Finish a social login with the code from the provider redirect
      parameters:
        - $ref: "#/components/parameters/Provider"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcCallbackRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current session
      responses:
        "204": { description: Logged out }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ me
  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user, verification level and organizations
      responses:
        "200": { $ref: "#/components/responses/Me" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [me]
      operationId: updateMe
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/password:
    post:
      tags: [me]
      operationId: changePassword
      summary: Change or set the password; revokes other sessions
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Password changed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/sessions:
    get:
      tags: [me]
      operationId: listMySessions
      summary: Active sessions of the current user
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SessionInfo" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/sessions/{sessionId}:
    delete:
      tags: [me]
      operationId: revokeMySession
      summary: Revoke one of my sessions
      parameters:
        - { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/mfa/totp/setup:
    post:
      tags: [me]
      operationId: setupTotp
      summary: Generate a new TOTP secret (not active until confirmed)
      responses:
        "200":
          description: Secret for the authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/mfa/totp/enable:
    post:
      tags: [me]
      operationId: enableTotp
      summary: Confirm the TOTP secret with a code; returns one-time recovery codes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Enabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/mfa/totp/disable:
    post:
      tags: [me]
      operationId: disableTotp
      summary: Disable TOTP after confirming a current code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "204": { description: Disabled }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/phone:
    post:
      tags: [me]
      operationId: startPhoneVerification
      summary: Send a verification code by SMS
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneRequest" }
      responses:
        "202": { description: Code sent }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/phone/verify:
    post:
      tags: [me]
      operationId: verifyPhone
      summary: Confirm the phone number with the SMS code
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/identity/start:
    post:
      tags: [me]
      operationId: startIdentityVerification
      summary: Begin identity verification (BankID in CZ); returns the provider URL
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcStartRequest" }
      responses:
        "200": { $ref: "#/components/responses/OidcStart" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/identity/callback:
    post:
      tags: [me]
      operationId: finishIdentityVerification
      summary: Finish identity verification with the code from the provider redirect
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OidcCallbackRequest" }
      responses:
        "200": { $ref: "#/components/responses/Me" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/consents:
    get:
      tags: [me]
      operationId: listConsents
      summary: Consent history (append-only)
      responses:
        "200":
          description: Consents, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Consent" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [me]
      operationId: recordConsent
      summary: Grant or withdraw a consent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConsentInput" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Consent" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/gdpr-requests:
    get:
      tags: [me]
      operationId: listGdprRequests
      summary: My data export and erasure requests
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GdprRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/data-exports:
    post:
      tags: [me]
      operationId: requestDataExport
      summary: Request a machine-readable export of my data (GDPR art. 15 and 20)
      responses:
        "202":
          description: Export queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GdprRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/data-exports/{requestId}/download:
    get:
      tags: [me]
      operationId: getDataExportDownload
      summary: Short-lived download URL of a finished export
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Download link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadLink" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/me/erasure:
    post:
      tags: [me]
      operationId: requestErasure
      summary: Request account erasure (GDPR art. 17) after a grace period
      responses:
        "202":
          description: Erasure scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GdprRequest" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [me]
      operationId: cancelErasure
      summary: Cancel a scheduled erasure during the grace period
      responses:
        "204": { description: Cancelled }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ orgs
  /v1/orgs:
    get:
      tags: [orgs]
      operationId: listMyOrgs
      summary: Organizations I belong to, personal first
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OrgMembership" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [orgs]
      operationId: createOrg
      summary: Create a company organization; the caller becomes its owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMembership" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [orgs]
      operationId: getOrg
      summary: One organization and my role in it
      responses:
        "200":
          description: Organization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMembership" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [orgs]
      operationId: updateOrg
      summary: Update organization details (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrgInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMembership" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/members:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [orgs]
      operationId: listOrgMembers
      summary: Members of an organization
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Member" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/members/{userId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [orgs]
      operationId: updateOrgMember
      summary: Change a member's role (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "204": { description: Updated }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [orgs]
      operationId: removeOrgMember
      summary: Remove a member, or leave the organization when userId is me
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/invitations:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [orgs]
      operationId: listOrgInvitations
      summary: Open invitations
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [orgs]
      operationId: createOrgInvitation
      summary: Invite someone by e-mail (owner, admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationInput" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/invitations/{invitationId}:
    delete:
      tags: [orgs]
      operationId: revokeOrgInvitation
      summary: Revoke an open invitation
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: invitationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Revoked }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/audit:
    get:
      tags: [orgs]
      operationId: listOrgAudit
      summary: Audit log of an organization (owner, admin)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/invitations/{token}:
    get:
      security: []
      tags: [orgs]
      operationId: getInvitation
      summary: Preview an invitation before accepting it
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/invitations/{token}/accept:
    post:
      tags: [orgs]
      operationId: acceptInvitation
      summary: Accept an invitation; the invitee e-mail must match my account
      parameters:
        - $ref: "#/components/parameters/InvitationToken"
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrgMembership" }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ jurisdictions
  /v1/jurisdictions:
    get:
      security: []
      tags: [jurisdictions]
      operationId: listJurisdictions
      summary: Active jurisdictions and their rules
      responses:
        "200":
          description: Jurisdictions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Jurisdiction" }
  /v1/jurisdictions/{code}:
    get:
      security: []
      tags: [jurisdictions]
      operationId: getJurisdiction
      summary: One jurisdiction
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, pattern: "^[A-Z]{2}$" } }
      responses:
        "200":
          description: Jurisdiction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Jurisdiction" }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ backoffice
  /v1/backoffice/users:
    get:
      tags: [backoffice]
      operationId: backofficeListUsers
      summary: Search users (staff)
      parameters:
        - { name: q, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Users, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserPage" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/users/{userId}:
    get:
      tags: [backoffice]
      operationId: backofficeGetUser
      summary: User detail with organizations (staff)
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/users/{userId}/impersonate:
    post:
      tags: [backoffice]
      operationId: backofficeImpersonate
      summary: Start a short audited session as the user (staff)
      description: The session cannot change credentials, MFA or request erasure. Ends with POST /v1/auth/logout.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImpersonateRequest" }
      responses:
        "200": { $ref: "#/components/responses/AuthResult" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/audit:
    get:
      tags: [backoffice]
      operationId: backofficeListAudit
      summary: Platform-wide audit log (staff)
      parameters:
        - { name: actor_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: org_id, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: entity, in: query, required: false, schema: { type: string, maxLength: 64 } }
        - $ref: "#/components/parameters/Before"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        default: { $ref: "#/components/responses/Problem" }
  # ------------------------------------------------------------------ catalog
  /v1/attributes:
    get:
      security: []
      tags: [catalog]
      operationId: getAttributeSchema
      summary: Listing attribute schema (catalog plus approved options)
      responses:
        "200":
          description: Schema
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttributeSchema" }
  /v1/addresses/search:
    get:
      security: []
      tags: [catalog]
      operationId: searchAddresses
      summary: Autocomplete Czech addresses (RÚIAN)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 8 } }
      responses:
        "200":
          description: Matching address points
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AddressSuggestion" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings:
    parameters:
      - $ref: "#/components/parameters/OrgId"
    get:
      tags: [catalog]
      operationId: listListings
      summary: Listings of an organization
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/ListingStatus" } }
      responses:
        "200":
          description: Listings, recently edited first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListingSummary" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      tags: [catalog]
      operationId: createListing
      summary: Wizard step 1 – address and unit; creates a draft listing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingCreate" }
      responses:
        "201": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/ListingId"
    get:
      tags: [catalog]
      operationId: getListing
      summary: Listing with unit, address, photos, AI suggestions and versions
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
    put:
      tags: [catalog]
      operationId: updateListing
      summary: Save the working copy (withdraws a pending review)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/submit:
    post:
      tags: [catalog]
      operationId: submitListing
      summary: Send the working copy to moderation as a new version
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/status:
    post:
      tags: [catalog]
      operationId: changeListingStatus
      summary: Pause, resume, mark as rented or archive
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [published, paused, rented, archived] }
      responses:
        "200": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/duplicate:
    post:
      tags: [catalog]
      operationId: duplicateListing
      summary: Copy the listing onto a new unit in the same building (without photos)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ListingId"
      responses:
        "201": { $ref: "#/components/responses/Listing" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/media:
    post:
      tags: [catalog]
      operationId: createMediaUpload
      summary: Reserve a photo and get a presigned upload URL (PUT the file there, then complete)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUploadRequest" }
      responses:
        "201":
          description: Upload slot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaUpload" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/media/{mediaId}/complete:
    post:
      tags: [catalog]
      operationId: completeMediaUpload
      summary: Start processing (EXIF strip, malware scan, vision) after the upload
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/OrgId"
      - $ref: "#/components/parameters/MediaId"
    patch:
      tags: [catalog]
      operationId: updateMedia
      summary: Change order and caption
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaUpdate" }
      responses:
        "200":
          description: Photo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Media" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [catalog]
      operationId: deleteMedia
      summary: Remove a photo
      responses:
        "204": { description: Removed }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/listings/{listingId}/suggestions:
    post:
      tags: [catalog]
      operationId: requestSuggestion
      summary: Ask the AI for attribute or text suggestions (generated in the background)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ListingId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [attributes, text] }
      responses:
        "202":
          description: Suggestion is being generated; poll the listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/orgs/{orgId}/suggestions/{suggestionId}/decision:
    post:
      tags: [catalog]
      operationId: decideSuggestion
      summary: Accept (all or selected attributes) or reject an AI suggestion
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: suggestionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionDecision" }
      responses:
        "200":
          description: Decided
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Suggestion" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/reviews:
    get:
      tags: [backoffice]
      operationId: backofficeListReviews
      summary: Moderation queue of submitted listing versions (staff)
      responses:
        "200":
          description: Pending versions, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ReviewItem" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/reviews/{versionId}:
    get:
      tags: [backoffice]
      operationId: backofficeGetReview
      summary: One submitted version with its snapshot (staff)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewDetail" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/reviews/{versionId}/decision:
    post:
      tags: [backoffice]
      operationId: backofficeDecideReview
      summary: Approve (publish) or reject a version (staff)
      parameters:
        - { name: versionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewDecision" }
      responses:
        "204": { description: Decided }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/filter-proposals:
    get:
      tags: [backoffice]
      operationId: backofficeListFilterProposals
      summary: New attribute options proposed by AI ingest (staff)
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [pending, approved, rejected], default: pending } }
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FilterProposal" }
        default: { $ref: "#/components/responses/Problem" }
  /v1/backoffice/filter-proposals/{proposalId}/decision:
    post:
      tags: [backoffice]
      operationId: backofficeDecideFilterProposal
      summary: Add the option to the schema or reject it (staff)
      parameters:
        - { name: proposalId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProposalDecision" }
      responses:
        "204": { description: Decided }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque session token from an AuthResult. The web app keeps it in an HttpOnly cookie on its own origin and forwards it server-side; the mobile app keeps it in secure storage.
  parameters:
    OrgId: { name: orgId, in: path, required: true, schema: { type: string, format: uuid } }
    Provider: { name: provider, in: path, required: true, schema: { type: string, enum: [google, apple] } }
    InvitationToken: { name: token, in: path, required: true, schema: { type: string, minLength: 20, maxLength: 128 } }
    Before:
      name: before
      in: query
      required: false
      description: Cursor; return items with an id lower than this one.
      schema: { type: string, format: uuid }
    ListingId: { name: listingId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    Limit: { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthResult:
      description: Session created, or a second factor is required
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AuthResult" }
    Me:
      description: Current user
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Me" }
    Listing:
      description: Listing
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Listing" }
    OidcStart:
      description: Redirect the browser to authorization_url
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OidcStart" }
  schemas:
    Health:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, fail, disabled]
        latency_ms:
          type: integer
          format: int64
        error:
          type: string
    Version:
      type: object
      required: [version, commit, built_at, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
        schema_version:
          type: integer
          format: int64
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable machine-readable error code for client-side translation, e.g. invalid_credentials.
          example: invalid_credentials
        errors:
          type: array
          description: Field errors (code invalid_fields).
          items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [key, reason]
      properties:
        key: { type: string }
        reason: { type: string }
    # --- auth
    UserLocale: { type: string, enum: [cs, en] }
    Email: { type: string, format: email, maxLength: 254 }
    Password: { type: string, minLength: 10, maxLength: 200 }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
    RegisterRequest:
      type: object
      required: [email, password, display_name, accept_terms_version, accept_privacy_version]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { $ref: "#/components/schemas/Password" }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: "#/components/schemas/UserLocale" }
        accept_terms_version: { type: string, minLength: 1, maxLength: 32 }
        accept_privacy_version: { type: string, minLength: 1, maxLength: 32 }
        marketing: { type: boolean, default: false }
        client: { $ref: "#/components/schemas/ClientKind" }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        password: { type: string, minLength: 1, maxLength: 200 }
        client: { $ref: "#/components/schemas/ClientKind" }
    MfaRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, minLength: 20, maxLength: 128 }
        code:
          type: string
          minLength: 6
          maxLength: 32
          description: 6-digit TOTP code or a one-time recovery code.
    MagicLinkRequest:
      type: object
      required: [email]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        locale: { $ref: "#/components/schemas/UserLocale" }
    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        client: { $ref: "#/components/schemas/ClientKind" }
    PasswordResetRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 128 }
        password: { $ref: "#/components/schemas/Password" }
    AuthResult:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [authenticated, mfa_required]
        session: { $ref: "#/components/schemas/SessionToken" }
        mfa_token:
          type: string
          description: Present when status is mfa_required; valid for 5 minutes.
    SessionToken:
      type: object
      required: [token, expires_at]
      properties:
        token: { type: string }
        expires_at: { type: string, format: date-time }
    AuthProvider:
      type: object
      required: [id, mock]
      properties:
        id: { type: string, enum: [google, apple] }
        mock: { type: boolean, description: True when the provider is the local mock IdP. }
    OidcStartRequest:
      type: object
      required: [redirect_uri]
      properties:
        redirect_uri: { type: string, format: uri, maxLength: 500, description: Must be on the deployment allowlist. }
    OidcStart:
      type: object
      required: [authorization_url]
      properties:
        authorization_url: { type: string, format: uri }
    OidcCallbackRequest:
      type: object
      required: [code, state, redirect_uri]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096 }
        state: { type: string, minLength: 20, maxLength: 128 }
        redirect_uri: { type: string, format: uri, maxLength: 500 }
        client: { $ref: "#/components/schemas/ClientKind" }
    # --- me
    VerificationLevel:
      type: string
      enum: [none, email, phone, identity]
      description: none → email → phone → identity (BankID). Features require a minimum level.
    Role:
      type: string
      enum: [owner, admin, agent, accountant, maintenance, viewer]
    Me:
      type: object
      required: [id, email, email_verified, display_name, locale, phone_verified, verification_level, mfa_enabled, is_staff, created_at, organizations]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified: { type: boolean }
        display_name: { type: string }
        locale: { $ref: "#/components/schemas/UserLocale" }
        phone: { type: string }
        phone_verified: { type: boolean }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        identity: { $ref: "#/components/schemas/VerifiedIdentity" }
        mfa_enabled: { type: boolean }
        recovery_codes_left: { type: integer }
        has_password: { type: boolean }
        is_staff: { type: boolean }
        created_at: { type: string, format: date-time }
        impersonator: { $ref: "#/components/schemas/UserRef" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    VerifiedIdentity:
      type: object
      required: [provider, verified_at]
      properties:
        provider: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        birthdate: { type: string, format: date }
        verified_at: { type: string, format: date-time }
    UserRef:
      type: object
      required: [id, email]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
    UpdateMeRequest:
      type: object
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        locale: { $ref: "#/components/schemas/UserLocale" }
    ChangePasswordRequest:
      type: object
      required: [new_password]
      properties:
        current_password: { type: string, maxLength: 200, description: Required when the account already has a password. }
        new_password: { $ref: "#/components/schemas/Password" }
    SessionInfo:
      type: object
      required: [id, client, created_at, last_seen_at, current]
      properties:
        id: { type: string, format: uuid }
        client: { type: string }
        user_agent: { type: string }
        ip: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current: { type: boolean }
        impersonated: { type: boolean }
    TotpSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: Base32 secret for manual entry. }
        otpauth_uri: { type: string, description: otpauth:// URI to render as a QR code. }
    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 32 }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }
    PhoneRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: '^\+[1-9][0-9]{7,14}$', description: E.164 }
    ConsentKind: { type: string, enum: [terms, privacy, marketing] }
    ConsentInput:
      type: object
      required: [kind, version, granted]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string, minLength: 1, maxLength: 32 }
        granted: { type: boolean }
    Consent:
      type: object
      required: [id, kind, version, granted, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string }
        granted: { type: boolean }
        created_at: { type: string, format: date-time }
    GdprRequest:
      type: object
      required: [id, kind, status, scheduled_at, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [export, erasure] }
        status: { type: string, enum: [pending, processing, done, failed, cancelled, rejected] }
        scheduled_at: { type: string, format: date-time }
        detail: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
    DownloadLink:
      type: object
      required: [url, expires_at]
      properties:
        url: { type: string, format: uri }
        expires_at: { type: string, format: date-time }
    # --- orgs
    Organization:
      type: object
      required: [id, kind, name, jurisdiction_code, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [personal, company] }
        name: { type: string }
        registration_no: { type: string }
        vat_no: { type: string }
        jurisdiction_code: { type: string }
        created_at: { type: string, format: date-time }
    OrgMembership:
      type: object
      required: [organization, role]
      properties:
        organization: { $ref: "#/components/schemas/Organization" }
        role: { $ref: "#/components/schemas/Role" }
    OrgInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        registration_no: { type: string, pattern: '^[0-9]{6,10}$' }
        vat_no: { type: string, maxLength: 20 }
        jurisdiction_code: { type: string, pattern: '^[A-Z]{2}$' }
    Member:
      type: object
      required: [user_id, email, display_name, role, verification_level, joined_at]
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        joined_at: { type: string, format: date-time }
    RoleInput:
      type: object
      required: [role]
      properties:
        role: { $ref: "#/components/schemas/Role" }
    InvitationInput:
      type: object
      required: [email, role]
      properties:
        email: { $ref: "#/components/schemas/Email" }
        role: { type: string, enum: [admin, agent, accountant, maintenance, viewer] }
        locale: { $ref: "#/components/schemas/UserLocale" }
    Invitation:
      type: object
      required: [id, email, role, expires_at, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InvitationPreview:
      type: object
      required: [org_name, role, email, inviter_name, expires_at, status]
      properties:
        org_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        email: { type: string }
        inviter_name: { type: string }
        expires_at: { type: string, format: date-time }
        status: { type: string, enum: [open, accepted, revoked, expired] }
    AuditEvent:
      type: object
      required: [id, occurred_at, entity, action, diff]
      properties:
        id: { type: string, format: uuid }
        occurred_at: { type: string, format: date-time }
        actor_id: { type: string, format: uuid }
        actor_email: { type: string }
        impersonator_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        entity: { type: string }
        entity_id: { type: string, format: uuid }
        action: { type: string }
        diff: { type: object, additionalProperties: true }
    AuditPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        next_before: { type: string, format: uuid }
    # --- jurisdictions
    Jurisdiction:
      type: object
      required: [code, name, currency, default_locale, deposit_max_months, notice_period_months, signature_provider, identity_provider, address_format, rules]
      properties:
        code: { type: string }
        name: { type: object, additionalProperties: { type: string } }
        currency: { type: string }
        default_locale: { type: string }
        deposit_max_months: { type: integer }
        notice_period_months: { type: integer }
        signature_provider: { type: string }
        identity_provider: { type: string }
        address_format: { type: object, additionalProperties: true }
        rules: { type: object, additionalProperties: true }
    # --- backoffice
    AdminUser:
      type: object
      required: [id, email, display_name, verification_level, mfa_enabled, is_staff, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        display_name: { type: string }
        verification_level: { $ref: "#/components/schemas/VerificationLevel" }
        mfa_enabled: { type: boolean }
        is_staff: { type: boolean }
        pseudonymized: { type: boolean }
        created_at: { type: string, format: date-time }
    AdminUserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminUser" }
        next_before: { type: string, format: uuid }
    AdminUserDetail:
      type: object
      required: [user, organizations]
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        organizations:
          type: array
          items: { $ref: "#/components/schemas/OrgMembership" }
    ImpersonateRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500, description: Stored in the audit log. }
    # --- catalog
    I18nText:
      type: object
      required: [cs, en]
      properties:
        cs: { type: string, maxLength: 10000 }
        en: { type: string, maxLength: 10000 }
    AttributeOption:
      type: object
      required: [value, label]
      properties:
        value: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        source: { type: string, enum: [catalog, ingest] }
    AttributeDef:
      type: object
      required: [key, type, group, label, filter, applies_to, options]
      properties:
        key: { type: string }
        type: { type: string, enum: [bool, int, range, enum, set, text] }
        group: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        filter: { type: boolean }
        unit: { type: string }
        min: { type: number, format: double }
        max: { type: number, format: double }
        applies_to: { type: array, items: { $ref: "#/components/schemas/UnitKind" } }
        options: { type: array, items: { $ref: "#/components/schemas/AttributeOption" } }
    AttributeGroup:
      type: object
      required: [key, label]
      properties:
        key: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
    AttributeSchema:
      type: object
      required: [groups, attributes]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/AttributeGroup" } }
        attributes: { type: array, items: { $ref: "#/components/schemas/AttributeDef" } }
    AddressSuggestion:
      type: object
      required: [ruian_id, label, municipality, postal_code, lat, lng]
      properties:
        ruian_id: { type: integer, format: int64 }
        label: { type: string }
        municipality: { type: string }
        district: { type: string }
        city_part: { type: string }
        street: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    UnitKind: { type: string, enum: [apartment, house, room, parking, storage, commercial] }
    ListingStatus: { type: string, enum: [draft, review, published, paused, rented, archived] }
    ListingCreate:
      type: object
      required: [ruian_id, unit_kind]
      properties:
        ruian_id: { type: integer, format: int64 }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
        parent_unit_id: { type: string, format: uuid, description: Rooms only – an existing apartment at the same address. }
        parent_layout: { type: string, maxLength: 20, description: Rooms only – layout of the apartment to create. }
        parent_floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
    ListingUpdate:
      type: object
      required: [title, description, attributes, location_precision]
      properties:
        title: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nText" }
        rent_amount: { type: integer, format: int64, minimum: 0, description: Minor units (haléře). }
        deposit_amount: { type: integer, format: int64, minimum: 0 }
        utilities_amount: { type: integer, format: int64, minimum: 0 }
        available_from: { type: string, format: date }
        min_term_months: { type: integer, format: int32, minimum: 0, maximum: 120 }
        attributes: { type: object, additionalProperties: true }
        location_precision: { type: string, enum: [exact, approximate] }
        unit_label: { type: string, minLength: 1, maxLength: 120 }
        floor: { type: integer, format: int32, minimum: -5, maximum: 100 }
        floor_area: { type: number, format: double, minimum: 1, maximum: 100000 }
        layout: { type: string, maxLength: 20 }
    ListingUnit:
      type: object
      required: [id, kind, label]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/UnitKind" }
        label: { type: string }
        floor: { type: integer, format: int32 }
        floor_area: { type: number, format: double }
        layout: { type: string }
        parent_id: { type: string, format: uuid }
        parent_label: { type: string }
    ListingAddress:
      type: object
      required: [label, city, postal_code, lat, lng]
      properties:
        label: { type: string }
        city: { type: string }
        city_part: { type: string }
        postal_code: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
    PhotoUrls:
      type: object
      additionalProperties: { type: string }
      description: Signed imgproxy URLs by variant (thumb 400px, medium 1024px, large 1920px).
    Media:
      type: object
      required: [id, status, filename, content_type, position, caption, urls]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [uploading, processing, ready, rejected] }
        rejection_reason: { type: string }
        filename: { type: string }
        content_type: { type: string }
        width: { type: integer, format: int32 }
        height: { type: integer, format: int32 }
        position: { type: integer, format: int32 }
        caption: { $ref: "#/components/schemas/I18nText" }
        urls: { $ref: "#/components/schemas/PhotoUrls" }
        room_type: { type: string }
        tags: { type: array, items: { type: string } }
    MediaUploadRequest:
      type: object
      required: [filename, content_type, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 255 }
        content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, format: int64, minimum: 1, maximum: 20971520 }
    MediaUpload:
      type: object
      required: [media, upload_url, expires_at]
      properties:
        media: { $ref: "#/components/schemas/Media" }
        upload_url: { type: string, description: Presigned PUT URL; send the file body with its Content-Type. }
        expires_at: { type: string, format: date-time }
    MediaUpdate:
      type: object
      required: [position, caption]
      properties:
        position: { type: integer, format: int32, minimum: 0, maximum: 1000 }
        caption: { $ref: "#/components/schemas/I18nText" }
    Suggestion:
      type: object
      required: [id, kind, status, payload, created_at]
      description: AI output. Applied to the listing only after the owner accepts it.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [attributes, text, photo_tags, privacy_blur] }
        status: { type: string, enum: [generating, pending, accepted, partially_accepted, rejected, failed] }
        media_id: { type: string, format: uuid }
        payload: { type: object, additionalProperties: true }
        model: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        decided_at: { type: string, format: date-time }
    SuggestionDecision:
      type: object
      required: [accept]
      properties:
        accept: { type: boolean }
        keys:
          type: array
          items: { type: string }
          description: Attribute suggestions only – accept just these attributes.
    ListingVersionInfo:
      type: object
      required: [id, version, status, submitted_at]
      properties:
        id: { type: string, format: uuid }
        version: { type: integer, format: int32 }
        status: { type: string, enum: [pending, approved, rejected, withdrawn] }
        submitted_at: { type: string, format: date-time }
        reviewed_at: { type: string, format: date-time }
        review_note: { type: string }
    ListingSummary:
      type: object
      required: [id, status, title, unit_kind, unit_label, address_label, currency, pending_review, updated_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ListingStatus" }
        title: { $ref: "#/components/schemas/I18nText" }
        unit_kind: { $ref: "#/components/schemas/UnitKind" }
        unit_label: { type: string }
        address_label: { type: string }
        rent_amount: { type: integer, format: int64 }
        currency: { type: string }
        cover_url: { type: string }
        pending_review: { type: boolean }
        published_version: { type: integer, format: int32 }
        updated_at: { type: string, format: date-time }
    Listing:
      type: object
      required: [id, org_id, status, title, description, currency, attributes, location_precision, pending_review,
        unit, property_id, address, media, suggestions, versions, deposit_max_months, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ListingStatus" }
        title: { $ref: "#/components/schemas/I18nText" }
        description: { $ref: "#/components/schemas/I18nText" }
        rent_amount: { type: integer, format: int64 }
        deposit_amount: { type: integer, format: int64 }
        utilities_amount: { type: integer, format: int64 }
        currency: { type: string }
        available_from: { type: string, format: date }
        min_term_months: { type: integer, format: int32 }
        attributes: { type: object, additionalProperties: true }
        location_precision: { type: string, enum: [exact, approximate] }
        published_version: { type: integer, format: int32 }
        published_at: { type: string, format: date-time }
        pending_review: { type: boolean }
        unit: { $ref: "#/components/schemas/ListingUnit" }
        property_id: { type: string, format: uuid }
        address: { $ref: "#/components/schemas/ListingAddress" }
        media: { type: array, items: { $ref: "#/components/schemas/Media" } }
        suggestions: { type: array, items: { $ref: "#/components/schemas/Suggestion" } }
        versions: { type: array, items: { $ref: "#/components/schemas/ListingVersionInfo" } }
        deposit_max_months: { type: integer, description: Jurisdiction cap for the deposit in monthly rents. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ReviewItem:
      type: object
      required: [version_id, listing_id, org_id, org_name, version, submitted_at, submitted_by_email, title, first_publication]
      properties:
        version_id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        version: { type: integer, format: int32 }
        submitted_at: { type: string, format: date-time }
        submitted_by_email: { type: string }
        title: { $ref: "#/components/schemas/I18nText" }
        first_publication: { type: boolean }
        cover_url: { type: string }
    ReviewDetail:
      type: object
      required: [item, snapshot, photos]
      properties:
        item: { $ref: "#/components/schemas/ReviewItem" }
        snapshot: { type: object, additionalProperties: true }
        photos:
          type: array
          items: { $ref: "#/components/schemas/PhotoVariants" }
    PhotoVariants:
      type: object
      required: [thumb, medium, large]
      properties:
        thumb: { type: string }
        medium: { type: string }
        large: { type: string }
    ReviewDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        note: { type: string, maxLength: 2000, description: Shown to the owner; required when rejecting. }
    FilterProposal:
      type: object
      required: [id, attribute_key, value, label, occurrences, status, created_at]
      properties:
        id: { type: string, format: uuid }
        attribute_key: { type: string }
        value: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        occurrences: { type: integer }
        status: { type: string, enum: [pending, approved, rejected] }
        example_listing_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
    ProposalDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean }
        label: { $ref: "#/components/schemas/I18nText" }
        note: { type: string, maxLength: 2000 }
