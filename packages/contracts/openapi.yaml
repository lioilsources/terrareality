      required: [rules, municipalities, defaults]
      properties:
        rules: { type: array, items: { $ref: "#/components/schemas/PortfolioRule" } }
        municipalities:
          type: array
          items:
            type: object
            required: [path, name]
            properties:
              path: { type: string }
              name: { type: string }
        defaults: { $ref: "#/components/schemas/PortfolioRules" }
    ResolvedRules:
      type: object
      required: [rules, sources, place]
      properties:
        rules: { $ref: "#/components/schemas/PortfolioRules" }
        sources: { type: array, items: { type: string, enum: [jurisdiction, municipality, group] } }
        place: { type: string, description: "Municipality name; empty when unknown." }
    RiskWeights:
      type: object
      required: [weights, defaults]
      properties:
        weights: { type: object, additionalProperties: { type: integer } }
        defaults: { type: object, additionalProperties: { type: integer } }
    PortfolioSummary:
      type: object
      required: [summary, changes, actions, model, created_at]
      description: An AI suggestion for the owner; it decides nothing (ADR 0003).
      properties:
        summary: { type: string }
        changes: { type: array, items: { type: string } }
        actions: { type: array, items: { type: string } }
        model: { type: string }
        created_at: { type: string, format: date-time }
