        name: { $ref: "#/components/schemas/I18nText" }
        active: { type: boolean, default: true }
    PromoProductPatch:
      type: object
      properties:
        net_amount: { type: integer, format: int64, minimum: 0 }
        active: { type: boolean }
        name: { $ref: "#/components/schemas/I18nText" }
        duration_days: { type: integer, minimum: 1, maximum: 365 }
