        amount: { type: integer, format: int64 }
        currency: { type: string }
        variable_symbol: { type: string }
        specific_symbol: { type: string }
        counterparty_name: { type: string }
        remittance: { type: string }
        match_status: { type: string, enum: [unmatched, matched, suggested, ignored] }
        share_id: { type: string, format: uuid }
        match_note: { type: string }
    BankOverview:
      type: object
