        path: { type: string }
        name: { type: string }
        slug: { type: string }
        level: { type: integer }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        geometry: { type: object, additionalProperties: true, description: GeoJSON MultiPolygon (simplified). }
    PublicListing:
      type: object
