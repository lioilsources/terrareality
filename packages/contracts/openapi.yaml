      required: [order_id, checkout_url]
      properties:
        order_id: { type: string, format: uuid }
        checkout_url: { type: string, format: uri }
    Promotion:
      type: object
      required: [id, listing_id, kind, starts_at, ends_at, order_id, active]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        kind: { type: string, enum: [top, highlight] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        order_id: { type: string, format: uuid }
        active: { type: boolean, description: Running right now. }
    PromotionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Promotion" } }
    OrderStatus:
      type: string
      enum: [pending, paid, failed, canceled]
    Order:
      type: object
      required: [id, listing_id, listing_title, product_code, status, net_amount, vat_amount, gross_amount, currency, starts_at, created_at]
      properties:
        id: { type: string, format: uuid }
        listing_id: { type: string, format: uuid }
        listing_title: { type: string, description: In the caller's locale. }
        product_code: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        net_amount: { type: integer, format: int64 }
        vat_amount: { type: integer, format: int64 }
        gross_amount: { type: integer, format: int64 }
        currency: { type: string }
        starts_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time }
        invoice_id: { type: string, format: uuid }
    OrderList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Order" } }
    Invoice:
      type: object
      required: [id, number, order_id, issued_on, taxable_supply_on, net_amount, vat_amount, gross_amount, currency, vat_rate_bp]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, description: "TR-YYYY-000001" }
        order_id: { type: string, format: uuid }
        issued_on: { type: string, format: date }
        taxable_supply_on: { type: string, format: date, description: Datum uskutečnění zdanitelného plnění. }
        net_amount: { type: integer, format: int64 }
        vat_amount: { type: integer, format: int64 }
        gross_amount: { type: integer, format: int64 }
        currency: { type: string }
        vat_rate_bp: { type: integer }
        sent_at: { type: string, format: date-time }
    InvoiceList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Invoice" } }
    RevolutMode:
      type: string
      enum: [sandbox, live]
    RevolutAccount:
      type: object
      required: [connected]
      properties:
        connected: { type: boolean }
        mode: { $ref: "#/components/schemas/RevolutMode" }
        connected_at: { type: string, format: date-time }
    RevolutAccountInput:
      type: object
      required: [api_key, mode]
      properties:
        api_key: { type: string, minLength: 10, maxLength: 500, description: "Merchant API secret key; stored encrypted, never returned." }
        mode: { $ref: "#/components/schemas/RevolutMode" }
    PaymentLink:
      type: object
      required: [id, share_id, provider, url, amount, currency, status, created_at]
      description: A card payment order in the landlord's own merchant account; the money goes landlord-direct (ADR 0002).
      properties:
        id: { type: string, format: uuid }
        share_id: { type: string, format: uuid }
        provider: { type: string, enum: [revolut] }
        url: { type: string, format: uri }
        amount: { type: integer, format: int64 }
        currency: { type: string }
        status: { type: string, enum: [created, paid, expired] }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    # --- backoffice (M7)
    Money:
      type: object
      required: [gross_amount, currency]
      properties:
        gross_amount: { type: integer, format: int64 }
        currency: { type: string }
    BackofficeMetrics:
      type: object
      required: [users, orgs, listings_published, listings_promoted, applications_30d, leases_signed_30d, moderation_open,
        attribute_suggestions_open, revenue_30d, orders_paid_30d]
      properties:
        users: { type: integer, format: int64 }
        orgs: { type: integer, format: int64 }
        listings_published: { type: integer, format: int64 }
        listings_promoted: { type: integer, format: int64 }
        applications_30d: { type: integer, format: int64 }
        leases_signed_30d: { type: integer, format: int64 }
        moderation_open: { type: integer, format: int64, description: Open message moderation cases plus listing versions waiting for review. }
        attribute_suggestions_open: { type: integer, format: int64 }
        revenue_30d: { $ref: "#/components/schemas/Money" }
        orders_paid_30d: { type: integer, format: int64 }
    FeatureFlag:
      type: object
      required: [key, enabled, description, source]
      properties:
        key: { type: string }
        enabled: { type: boolean }
        description: { type: string }
        source: { type: string, enum: [db, default] }
        updated_at: { type: string, format: date-time }
    FeatureFlagList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/FeatureFlag" } }
    FeatureFlagInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        description: { type: string, maxLength: 500 }
    AttributeSuggestion:
      type: object
      required: [id, key, type, group_key, label, options, occurrences, status, created_at]
      description: An attribute the catalog does not have yet, proposed by AI ingest (a suggestion, ADR 0003).
      properties:
        id: { type: string, format: uuid }
        key: { type: string }
        type: { type: string, enum: [bool, int, range, enum, set, text] }
        group_key: { type: string }
        label: { $ref: "#/components/schemas/I18nText" }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { $ref: "#/components/schemas/I18nText" }
        example_listing_id: { type: string, format: uuid }
        occurrences: { type: integer }
        model: { type: string }
        status: { type: string, enum: [open, approved, rejected] }
        note: { type: string }
        decided_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    AttributeSuggestionList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/AttributeSuggestion" } }
    AttributeSuggestionDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string, maxLength: 2000 }
    ContractTemplate:
      type: object
      required: [name, title, reviewed]
      properties:
        name: { type: string }
        title: { type: string }
        reviewed: { type: boolean, description: Reviewed by a lawyer for this version. }
    ContractTemplateList:
      type: object
      required: [version, items]
      properties:
        version: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/ContractTemplate" } }
