        vat_rate_bp: { type: integer, description: "VAT rate in basis points (2100 = 21 %)." }
        vat_amount: { type: integer, format: int64 }
        gross_amount: { type: integer, format: int64 }
        currency: { type: string }
        name: { $ref: "#/components/schemas/I18nText" }
        active: { type: boolean }
    PromoProductList:
