      properties:
        id: { type: string, format: uuid }
        org_id: { type: string, format: uuid }
        org_name: { type: string }
        code: { type: integer, format: int64, description: Variable symbol of payments. }
        state: { $ref: "#/components/schemas/LeaseState" }
        template: { $ref: "#/components/schemas/LeaseTemplate" }
        property_address: { type: string }
        unit_label: { type: string }
        tenant_names: { type: string }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        rent_amount: { type: integer, format: int64 }
        currency: { type: string }
        created_at: { type: string, format: date-time }
    LeaseParty:
      type: object
      required: [id, role, name, share_bps, position, me]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [landlord, tenant, co_tenant, subtenant, guarantor] }
        name: { type: string }
        email: { type: string }
        share_bps: { type: integer }
        position: { type: integer, description: Specific symbol of this party's payments. }
        me: { type: boolean }
        signed_at: { type: string, format: date-time }
        debt: { type: integer, format: int64, description: Due and unpaid amount today. }
    LeaseDocument:
      type: object
      required: [id, kind, version, filename, sha256, url, created_at]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [draft, final, signed, scan, evidence] }
        version: { type: integer }
        filename: { type: string }
        sha256: { type: string }
        url: { type: string }
        created_at: { type: string, format: date-time }
    LeaseDetail:
      type: object
      required: [lease, parties, documents, landlord_view, payee_iban, payee_name, due_day, notice_months, deposit_amount, services_amount, clauses, total_debt]
      properties:
        lease: { $ref: "#/components/schemas/LeaseSummary" }
