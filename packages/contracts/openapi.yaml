      properties:
        connections: { type: array, items: { $ref: "#/components/schemas/BankConnection" } }
        transactions: { type: array, items: { $ref: "#/components/schemas/BankTransaction" } }
    # --- portfolio (M6b)
    RiskBand:
      type: string
      enum: [low, medium, high]
    RiskFactor:
      type: object
      required: [key, group, value, known]
      properties:
        key: { type: string, enum: [debt, escalations, overdue_days, deposit_coverage, passport, term_end, notice, joint_nonpayer, market_rent, market_supply] }
        group: { type: string, enum: [payments, deposit, passport, contract, location] }
        weight: { type: integer, description: Absent for tenants. }
        value: { type: number, minimum: 0, maximum: 1 }
        points: { type: number, description: Contribution to the score; absent for tenants. }
        known: { type: boolean, description: false when there is no data (counted as 0). }
        detail: { type: object, additionalProperties: true }
    LeaseRisk:
      type: object
      required: [factors, model_version, computed_at, landlord]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, description: Absent for tenants. }
        band: { $ref: "#/components/schemas/RiskBand" }
        factors: { type: array, items: { $ref: "#/components/schemas/RiskFactor" } }
        model_version: { type: string }
        computed_at: { type: string, format: date-time }
        landlord: { type: boolean }
    RentRollRow:
      type: object
      required: [kind, state, municipality, municipality_path, region, address, unit, currency, group_ids]
      properties:
        kind: { type: string, enum: [lease, vacant] }
        lease_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        code: { type: integer, format: int64 }
        state: { type: string }
        municipality: { type: string }
        municipality_path: { type: string }
        region: { type: string }
        region_path: { type: string }
        address: { type: string }
        unit: { type: string }
        tenants: { type: string, description: Initials only for the investor role. }
        rent: { type: integer, format: int64 }
        services: { type: integer, format: int64 }
        currency: { type: string }
        due_day: { type: integer }
        starts_on: { type: string, format: date }
        ends_on: { type: string, format: date }
        notice_on: { type: string, format: date }
        deposit: { type: integer, format: int64 }
        deposit_paid: { type: integer, format: int64 }
        billed: { type: integer, format: int64, description: Receivables due by today (ledger). }
        paid: { type: integer, format: int64, description: Payments booked by today (ledger). }
        debt: { type: integer, format: int64, description: Receivable balance by today. }
        risk_score: { type: integer }
        risk_band: { $ref: "#/components/schemas/RiskBand" }
        group_ids: { type: array, items: { type: string, format: uuid } }
        lat: { type: number }
        lng: { type: number }
        asking_rent: { type: integer, format: int64 }
        listing_status: { type: string }
    RentRoll:
      type: object
      required: [role, rows, groups, totals]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        rows: { type: array, items: { $ref: "#/components/schemas/RentRollRow" } }
        groups: { type: array, items: { $ref: "#/components/schemas/PortfolioGroup" } }
        totals:
          type: object
          required: [leases, vacant, monthly, billed, paid, debt]
          properties:
            leases: { type: integer }
            vacant: { type: integer }
            monthly: { type: integer, format: int64 }
            billed: { type: integer, format: int64 }
            paid: { type: integer, format: int64 }
            debt: { type: integer, format: int64 }
    PortfolioCity:
      type: object
      required: [path, name, region, leases, vacant, monthly, expected, received, debt, share]
      properties:
        path: { type: string }
        name: { type: string }
        region: { type: string }
        leases: { type: integer }
        vacant: { type: integer }
        monthly: { type: integer, format: int64 }
        expected: { type: integer, format: int64 }
        received: { type: integer, format: int64 }
        debt: { type: integer, format: int64 }
        weighted_risk: { type: integer }
        band: { $ref: "#/components/schemas/RiskBand" }
        share: { type: number }
        lat: { type: number }
        lng: { type: number }
    PortfolioShare:
      type: object
      required: [name, share, amount, count]
      properties:
        name: { type: string }
        share: { type: number }
        amount: { type: integer, format: int64 }
        count: { type: integer }
    PortfolioAttention:
      type: object
      required: [kind, severity, label, city]
      properties:
        kind: { type: string, enum: [escalation, debt, ending, notice, vacant, high_risk] }
        severity: { type: integer, minimum: 1, maximum: 3 }
        lease_id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        label: { type: string }
        city: { type: string }
        amount: { type: integer, format: int64 }
        date: { type: string, format: date }
        score: { type: integer }
    PortfolioDashboard:
      type: object
      required: [role, currency, leases, vacant, monthly, debt, period, expected, received, cities, concentration, attention, trend]
      properties:
        role: { $ref: "#/components/schemas/Role" }
        currency: { type: string }
        leases: { type: integer }
        vacant: { type: integer }
        monthly: { type: integer, format: int64 }
        debt: { type: integer, format: int64 }
        weighted_risk: { type: integer }
        band: { $ref: "#/components/schemas/RiskBand" }
        period: { type: string, description: YYYY-MM of the current month. }
        expected: { type: integer, format: int64 }
        received: { type: integer, format: int64 }
        cities: { type: array, items: { $ref: "#/components/schemas/PortfolioCity" } }
        concentration:
          type: object
          required: [hhi]
          properties:
            top_city: { $ref: "#/components/schemas/PortfolioShare" }
            top_tenant: { $ref: "#/components/schemas/PortfolioShare" }
            ending_peak: { $ref: "#/components/schemas/PortfolioShare" }
            hhi: { type: number, description: Herfindahl index of income over municipalities (0..1). }
        attention: { type: array, items: { $ref: "#/components/schemas/PortfolioAttention" } }
        trend:
          type: array
          items:
            type: object
            required: [period, expected, received]
            properties:
              period: { type: string }
              expected: { type: integer, format: int64 }
              received: { type: integer, format: int64 }
              weighted_risk: { type: integer }
    PortfolioGroup:
      type: object
      required: [id, name, color, property_ids, lease_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        color: { type: string }
        property_ids: { type: array, items: { type: string, format: uuid } }
        lease_ids: { type: array, items: { type: string, format: uuid } }
    PortfolioGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        color: { type: string, pattern: "^#[0-9a-f]{6}$" }
        property_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
        lease_ids: { type: array, maxItems: 500, items: { type: string, format: uuid } }
    PortfolioGroups:
      type: object
      required: [groups, properties]
      properties:
        groups: { type: array, items: { $ref: "#/components/schemas/PortfolioGroup" } }
        properties:
          type: array
          items:
            type: object
            required: [id, name, address]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
              address: { type: string }
    PortfolioRules:
      type: object
      description: Unset fields inherit (jurisdiction defaults, then municipality, then group).
      properties:
        reminder_before_days: { type: integer, minimum: 0, maximum: 14 }
        overdue_days: { type: integer, minimum: 1, maximum: 14 }
        escalation_days: { type: integer, minimum: 2, maximum: 30 }
        deposit_months: { type: integer, minimum: 0, maximum: 12 }
        notice_months: { type: integer, minimum: 1, maximum: 12 }
    PortfolioRule:
      type: object
      required: [id, scope, scope_name, rules, updated_at]
      properties:
        id: { type: string, format: uuid }
        scope: { type: string, enum: [municipality, group] }
        municipality: { type: string }
        group_id: { type: string, format: uuid }
        scope_name: { type: string }
        rules: { $ref: "#/components/schemas/PortfolioRules" }
        updated_at: { type: string, format: date-time }
    PortfolioRuleInput:
      type: object
      required: [rules]
      properties:
        municipality: { type: string, maxLength: 200, description: Admin path of the municipality. }
        group_id: { type: string, format: uuid }
        rules: { $ref: "#/components/schemas/PortfolioRules" }
    PortfolioRuleList:
