# pgBackRest for TerraReality production (stanza "terra").
# Repository: Hetzner Object Storage (S3 compatible), encrypted client side.
# Secrets come from the container environment, never from this file:
#   PGBACKREST_REPO1_S3_KEY, PGBACKREST_REPO1_S3_KEY_SECRET, PGBACKREST_REPO1_CIPHER_PASS
# Bucket/endpoint/region can be overridden the same way (PGBACKREST_REPO1_S3_BUCKET, ...).
# scripts/restore-test.sh reuses this file with PGBACKREST_REPO1_TYPE=posix.
#
# Schedule (infra/hetzner/db/systemd): full Sunday 02:30, diff Mon-Sat 02:30,
# WAL continuously (archive_timeout=60 s in postgresql.conf) -> RPO <= 1 h
# (in practice about a minute).
# Retention: 4 full backups (about 4 weeks) with their diffs and the WAL needed
# for point-in-time recovery anywhere inside that window.

[global]
repo1-type=s3
repo1-path=/pgbackrest
repo1-s3-bucket=terrareality-pgbackrest
repo1-s3-endpoint=fsn1.your-objectstorage.com
repo1-s3-region=fsn1
repo1-s3-uri-style=path
repo1-cipher-type=aes-256-cbc
repo1-retention-full-type=count
repo1-retention-full=4
repo1-retention-diff=7
repo1-bundle=y
repo1-block=y

compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y

archive-async=y
# WAL waiting for upload while Object Storage is unreachable. Beyond this limit pgBackRest drops
# WAL (PostgreSQL keeps running, but PITR has a gap until the next full backup); below it pg_wal
# and the spool grow on /srv. 12 GiB is roughly half a day of busy WAL with archive_timeout=60
# and stays well inside the 80 GB volume. WalArchiveFailing pages after 15 min of failures;
# after any such incident take a full backup (docs/runbooks/backup.md, Troubleshooting).
archive-push-queue-max=12GiB
spool-path=/var/spool/pgbackrest

log-path=/var/log/pgbackrest
log-level-console=info
log-level-file=detail

[global:archive-push]
process-max=2

[global:archive-get]
process-max=2

[terra]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
# Superuser created by the image entrypoint (POSTGRES_USER); local socket auth is trust.
pg1-user=terra
