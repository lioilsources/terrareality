# PostgreSQL 17 settings for the TerraReality DB server. Everything not set
# here keeps the built-in default. Size memory settings to the server type
# (defaults below fit 8 GB RAM, e.g. cx33).

listen_addresses = '*'          # the container port is published on the private IP only
port = 5432
max_connections = 200
password_encryption = scram-sha-256

shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and archiving (pgBackRest). archive_timeout forces a segment switch at
# least every minute, so the recovery point objective is far below 1 hour.
wal_level = replica
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
archive_mode = on
archive_command = 'pgbackrest --stanza=terra archive-push %p'
archive_timeout = 60
max_wal_senders = 3
restore_command = 'pgbackrest --stanza=terra archive-get %f "%p"'

# Observability
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'

# TLS on the private network (review S-I12). scripts/pg-tls-init.sh writes the server certificate,
# key, internal CA and this include into PG_TLS_DIR (default /srv/pgtls, mounted read-only at
# /etc/postgresql/tls by docker-compose.db.yml). Without the file (restore drills, a fresh VM before
# the script ran) the server runs without TLS and clients with sslmode=verify-full refuse to connect.
# ssl.conf also switches hba_file to the script's TLS-only pg_hba.conf (hostssl for every remote
# client, hostnossl rejected); without it the image default pg_hba in the data directory applies.
include_if_exists = '/etc/postgresql/tls/ssl.conf'
