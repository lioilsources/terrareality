# PostgreSQL 17 settings for the TerraReality DB server. Everything not set
# here keeps the built-in default. Size memory settings to the server type
# (defaults below fit 8 GB RAM, e.g. cx33).

listen_addresses = '*'          # the container port is published on the private IP only
port = 5432
max_connections = 200
password_encryption = scram-sha-256

shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
random_page_cost = 1.1
effective_io_concurrency = 200

# WAL and archiving (pgBackRest). archive_timeout forces a segment switch at
# least every minute, so the recovery point objective is far below 1 hour.
wal_level = replica
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min
archive_mode = on
archive_command = 'pgbackrest --stanza=terra archive-push %p'
archive_timeout = 60
max_wal_senders = 3
restore_command = 'pgbackrest --stanza=terra archive-get %f "%p"'

# Observability
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_timezone = 'UTC'
timezone = 'UTC'
