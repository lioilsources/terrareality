# Single-binary Tempo, local storage, 14 days retention. Receives OTLP from
# api/worker (OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces).
stream_over_http_enabled: true
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        http: { endpoint: "0.0.0.0:4318" }
        grpc: { endpoint: "0.0.0.0:4317" }
ingester:
  max_block_duration: 5m
compactor:
  compaction:
    block_retention: 336h
storage:
  trace:
    backend: local
    wal: { path: /var/tempo/wal }
    local: { path: /var/tempo/blocks }
usage_report:
  reporting_enabled: false
