# Single-binary Loki with local filesystem storage. Retention (decision, docs/security/asvs-l2.md
# 7.1 and docs/runbooks/incident.md): application logs 30 days; Caddy access logs 14 days (they
# carry truncated client IPs and paths; query strings and invitation tokens are redacted in the
# Caddyfile). The compactor deletes expired chunks.
auth_enabled: false
server:
  http_listen_port: 3100
  log_level: warn
common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }
limits_config:
  retention_period: 720h
  retention_stream:
    - selector: '{service="caddy"}'
      priority: 1
      period: 336h
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
analytics:
  reporting_enabled: false
