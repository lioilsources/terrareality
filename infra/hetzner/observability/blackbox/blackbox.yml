modules:
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      follow_redirects: true
      fail_if_not_ssl: true
  # /healthz returns 503 when any check fails; also require the worker heartbeat explicitly.
  http_healthz:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
      valid_status_codes: [200]
      fail_if_body_not_matches_regexp:
        - '"worker":\{[^}]*"status":"ok"'
