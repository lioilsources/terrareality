# Local development dependencies. Start with `make up` from the repo root.
# Host ports avoid the defaults so this stack can run next to other projects
# (e.g. ChatShop on 5432).
name: terra-dev

services:
  db:
    build: ./postgres
    image: terra/postgres:17-postgis-pgvector
    environment:
      POSTGRES_USER: terra
      POSTGRES_PASSWORD: terra
      POSTGRES_DB: terra
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terra -d terra"]
      interval: 3s
      timeout: 3s
      retries: 20

  temporal:
    # Single-binary dev server with SQLite persistence and Web UI on :8233.
    image: temporalio/temporal:1.4.1
    user: "0:0"  # the image user cannot write to a fresh named volume
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes: [temporaldata:/data]

  centrifugo:
    image: centrifugo/centrifugo:v6
    command: ["centrifugo", "--config", "/centrifugo/config.json"]
    ports: ["8000:8000"]
    volumes: [./centrifugo/config.json:/centrifugo/config.json:ro]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    # S3-compatible object storage (MinIO no longer publishes images).
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
    ports: ["8333:8333"]
    volumes:
      - s3data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  imgproxy:
    image: ghcr.io/imgproxy/imgproxy:v3
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://s3:8333
      AWS_ACCESS_KEY_ID: terra
      AWS_SECRET_ACCESS_KEY: terra-dev-secret
      AWS_REGION: us-east-1
      IMGPROXY_KEY: 6465762d696d6770726f78792d6b6579
      IMGPROXY_SALT: 6465762d696d6770726f78792d73616c74
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_ENABLE_AVIF_DETECTION: "true"
      IMGPROXY_STRIP_METADATA: "true"
    ports: ["8081:8080"]
    depends_on: [s3]

  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  temporaldata:
  s3data:
